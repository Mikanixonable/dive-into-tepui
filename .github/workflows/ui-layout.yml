name: UI layout checks

on:
  pull_request:
    paths:
      - 'src/hud/**'
      - 'src/game/hud/**'
      - 'src/game/creative/object-placer-panel.ts'
      - 'tools/browser-smoke.mjs'
      - 'tools/chrome-session.mjs'
      - 'tools/layout-smoke-retry.mjs'
      - 'tools/verify-hud-layout.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-layout.yml'

concurrency:
  group: ui-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hud-layout:
    runs-on: ubuntu-latest
    env:
      SMOKE_LAYOUT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run verify:ui-style
      - run: npm run verify:hud-layout
      - run: npm run typecheck
      - run: npm run build

      # ランナー同梱の google-chrome は版が流動する — Chrome 153 の SwiftShader WebGPU は
      # createBuffer(mappedAtCreation) が全サイズで失敗する回帰を持つため、既知の安定版を
      # Chrome for Testing から固定取得する(CHROME_PATH は tools/chrome-session.mjs が読む)。
      - name: Pin Chrome for layout smoke
        run: |
          npx --yes @puppeteer/browsers install chrome@152.0.7977.82 --path /tmp/tepui-cft
          CHROME_PATH=$(echo /tmp/tepui-cft/chrome/linux-*/chrome-linux64/chrome)
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: HUD geometry suite
        run: npm run smoke:layout-suite
