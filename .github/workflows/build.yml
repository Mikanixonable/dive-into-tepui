name: Build and deploy

on:
  push:
    branches: [main]

# docs/ への push-back とその他のトリガー実行が同時に走らないようにする
concurrency:
  group: build-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ビルド結果のコミット(下記)が新たなビルドを誘発しないよう、
    # [skip ci] 付きコミットではジョブ自体を起動しない
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # webpack の出力先は docs/(GitHub Pages の公開元)。
      # release ブランチを作成し、そこにビルド結果を含めて強制 push する。
      - name: Commit and push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # release ブランチを現在の main から派生 (チェックアウト)
          git checkout -B release
          
          # docs/ は .gitignore に含まれるため強制的に追加
          git add -f docs
          
          # 変更がある場合のみコミット
          if git diff --cached --quiet; then
            echo "docs/ に変更なし"
          else
            git commit -m "build: deploy to release [skip ci]"
            git push origin release -f
          fi
