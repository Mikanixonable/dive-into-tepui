name: Temporary Earth z8 validation

on:
  push:
    branches: [feat/earth-surface-z8]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:render
      - run: npm run earth-surface:test
      - run: npm run earth-surface:pages-test
      - run: python3 -m pip install numpy pillow pyshp
      - run: cd tools/earth-surface && python3 -m unittest test_bake.py test_preflight.py
