name: Rebuild ship module assets

on:
  push:
    branches: [main]
    paths:
      - tools/model-builder/blender/build-ship-modules.py
      - tools/model-builder/build-ship-modules.mjs
      - tools/model-builder/export-models.mjs
      - tools/model-builder/ship-modules.mjs
      - .github/workflows/ship-modules.yml
  workflow_dispatch:

concurrency:
  group: ship-module-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ship modules baked]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Blender 5.0.1
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-5.0.1-linux-x64
          key: blender-5.0.1-linux-x64

      - name: Install Blender 5.0.1
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/blender.tar.xz"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C .cache
          test -x .cache/blender-5.0.1-linux-x64/blender

      - name: Generate GLB and baked JSON
        env:
          BLENDER_BIN: ${{ github.workspace }}/.cache/blender-5.0.1-linux-x64/blender
        run: npm run ship-modules:build

      - name: Lint ship module build tools
        run: npx eslint --quiet tools/model-builder/build-ship-modules.mjs tools/model-builder/export-models.mjs tools/model-builder/ship-modules.mjs

      - name: Verify ship module render contracts
        run: npm run test:render

      - name: Commit generated ship module assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets-src/ship-modules src/assets/models/shipModules.json
          if git diff --cached --quiet; then
            echo "ship module assets are already current"
            exit 0
          fi

          git commit -m "build: bake ship module assets [ship modules baked] [skip ci]"
          git fetch origin main

          # Unrelated commits may land while Blender is running. Rebase over them,
          # but never publish assets produced from an obsolete generator revision.
          if ! git diff --quiet "$GITHUB_SHA"..origin/main --             tools/model-builder/blender/build-ship-modules.py             tools/model-builder/build-ship-modules.mjs             tools/model-builder/export-models.mjs             tools/model-builder/ship-modules.mjs             .github/workflows/ship-modules.yml; then
            echo "ship module generator changed during this run; a newer run will bake it"
            exit 0
          fi

          git rebase origin/main
          git push origin HEAD:main
