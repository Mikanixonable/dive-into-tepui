name: Cloud Step 3-7 CI

on:
  push:
    branches: [workspace3, workspace3-step7]
  pull_request:
    branches: [workspace3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:render
      - run: npm run test:game
      - run: npm run cloud-reconstruction:measure
      - run: npm run build
      - run: node node_modules/webpack-cli/bin/cli.js --config webpack.cloud-lab.config.js --mode production
      # GPU baseline is intentionally not a push gate. Step 3/7 acceptance requires
      # target hardware; headless CI is kept for deterministic correctness checks.
