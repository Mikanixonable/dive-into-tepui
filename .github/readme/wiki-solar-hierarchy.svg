<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>太陽系モデル</title><desc>天体は定義・運動・表示を分けて扱う</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.s{fill:#3478ff}
.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.soft{fill:#15171c}.line{fill:none;stroke:#89838f;stroke-width:1.5}.accent{fill:none;stroke:#ff3155;stroke-width:2}.signal{fill:none;stroke:#3478ff;stroke-width:2}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}.xs{font-size:10px;letter-spacing:.8px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs><rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">太陽系モデル</text><text x="55" y="72" class="m d k">天体は定義・運動・表示を分けて扱う</text><g transform="translate(55.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">SUN</text><text x="18" y="62" class="sans t v">太陽</text><text x="18" y="91" class="m d sm">中心光源・重力源</text><text x="18" y="115" class="m d sm">天体暦の基準</text></g><g transform="translate(333.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">PLANETS</text><text x="18" y="62" class="sans t v">惑星</text><text x="18" y="91" class="m d sm">親子関係と軌道</text><text x="18" y="115" class="m d sm">固有の重力・自転</text></g><g transform="translate(611.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">SATELLITES</text><text x="18" y="62" class="sans t v">衛星</text><text x="18" y="91" class="m d sm">親天体中心の運動</text><text x="18" y="115" class="m d sm">月など</text></g><g transform="translate(889.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">SMALL BODIES</text><text x="18" y="62" class="sans t v">小天体</text><text x="18" y="91" class="m d sm">点群・個体表示</text><text x="18" y="115" class="m d sm">距離で表現を切替</text></g><text x="55" y="400" class="m b sm">CelestialSystem が天体系を束ね、物理と表示の共通入口になる。</text></svg>