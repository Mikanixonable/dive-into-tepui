<rect x="225" y="0" width="220" height="270" rx="16" class="box"/><text x="243" y="31" class="m a k">地表</text><circle cx="335" cy="151" r="75" fill="#48506a" stroke="#d6d6d0"/><path d="M278 132C307 96 353 87 390 118 365 135 343 146 321 156 301 165 286 155 278 132Z" fill="#a8aec0"/><text x="262" y="244" class="m d sm">TSL 材質 / 地形</text>
<rect x="490" y="0" width="600" height="270" rx="16" class="box"/><text x="508" y="31" class="m a k">大気レイヤー</text>
<g transform="translate(605 150)"><circle r="70" fill="#48506a"/><circle r="82" fill="none" stroke="#3478ff" stroke-width="10" opacity=".28"/><circle r="91" fill="none" stroke="#ff3155" stroke-width="6" opacity=".22"/><path d="M-77-24C-40-51 10-48 53-13" fill="none" stroke="#d6d6d0" stroke-width="14" stroke-linecap="round" opacity=".7"/><path d="M-85 14C-42 2 9 10 74 41" fill="none" stroke="#eeeaf5" stroke-width="8" stroke-linecap="round" opacity=".45"/></g>
<g transform="translate(720 73)"><text class="m s v">大気</text><text y="29" class="m d sm">散乱 / リム</text><text y="75" class="m t v">雲</text><text y="104" class="m d sm">不透明 + 体積描画</text><text y="150" class="m an v">大気光</text><text y="179" class="m d sm">夜側発光</text></g>
<g transform="translate(920 73)"><text class="m a v">オーロラ</text><text y="29" class="m d sm">場 / カーテン</text><text y="75" class="m t v">照明</text><text y="104" class="m d sm">太陽 / 影</text><text y="150" class="m t v">最終合成</text><text y="179" class="m d sm">地表 + レイヤー</text></g>
<path d="M180 135H218M445 135H483" class="accent" marker-end="url(#arrR)"/>
</g></svg>