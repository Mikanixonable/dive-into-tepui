<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Cislunar progression diagram</title>
<desc id="desc">A stylized progression from NRHO through L1 and L2 toward low Earth orbit.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08111d"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.l{fill:#89838f;font-size:13px;letter-spacing:1px}.v{fill:#eeeaf5;font-size:18px;font-weight:700}</style>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<path d="M90 165H1110" stroke="#48506a" stroke-width="2"/>
<path d="M140 165C260 72 410 68 520 165S795 257 930 165 1060 113 1110 165" fill="none" stroke="#ff3155" stroke-width="2" stroke-dasharray="7 8" opacity=".68"/>

<g transform="translate(145 165)">
 <circle r="32" fill="#182a3d" stroke="#ff3155"/>
 <circle r="12" fill="none" stroke="#ff3155"/><path d="M-19 0H19M0-19V19" stroke="#ff3155" opacity=".7"/>
 <text x="-33" y="-55" class="m l">START</text><text x="-34" y="62" class="m v">NRHO</text>
 <text x="-68" y="84" class="m l">BASE / SURVIVAL</text>
</g>

<g transform="translate(390 165)">
 <circle r="8" fill="#3478ff" filter="url(#g)"/><circle r="28" fill="none" stroke="#3478ff" opacity=".6"/>
 <text x="-10" y="-52" class="m l">FRONTIER 01</text><text x="-22" y="62" class="m v">L1</text>
 <text x="-74" y="84" class="m l">POWER / LOGISTICS</text>
</g>

<g transform="translate(630 165)">
 <circle r="8" fill="#ff6b82" filter="url(#g)"/><circle r="28" fill="none" stroke="#ff6b82" opacity=".6"/>
 <text x="-10" y="-52" class="m l">FRONTIER 02</text><text x="-22" y="62" class="m v">L2</text>
 <text x="-91" y="84" class="m l">SCIENCE / SPECIAL RESOURCES</text>
</g>

<g transform="translate(915 165)">
 <circle r="56" fill="#48506a" stroke="#d6d6d0"/>
 <path d="M-36-15C-15-35 14-35 38-15 23-5 8 2-7 9-21 15-32 5-36-15Z" fill="#a8aec0"/>
 <ellipse rx="83" ry="28" fill="none" stroke="#ff3155" opacity=".7" transform="rotate(-12)"/>
 <text x="-8" y="-81" class="m l">FRONTIER 03</text><text x="-28" y="91" class="m v">LEO</text>
 <text x="-92" y="113" class="m l">COMBAT / RESOURCE RECOVERY</text>
</g>

<g transform="translate(1050 165)">
 <circle r="4" fill="#ff6b82"/><circle r="9" fill="none" stroke="#ff6b82"/>
 <circle cx="19" cy="-24" r="3" fill="#ff6b82"/><circle cx="-15" cy="22" r="3" fill="#ff6b82"/>
 <text x="-42" y="-52" class="m l">AUTONOMOUS</text><text x="-35" y="-32" class="m l">WEAPONS</text>
</g>

<text x="70" y="44" class="m" fill="#eeeaf5" font-size="19" font-weight="700">DESIGN DIRECTION — CISLUNAR PROGRESSION</text>
<text x="70" y="69" class="m l">LONG-FORM GAMEPLAY CONCEPT · NOT ALL ELEMENTS ARE IMPLEMENTED</text>
</svg>