<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Dive into Tepui simulation and presentation stack</title>
<desc id="desc">Layers from immutable definitions and physics through game model, presentation derivation and WebGPU devices.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:system-ui,-apple-system,sans-serif;font-size:20px;font-weight:700;fill:#fff}.s{font-size:13px;fill:#89838f}.box{fill:#0e1014;stroke:#48506a;stroke-width:1.5}.arrow{stroke:#89838f;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#89838f"/></marker>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<text x="55" y="46" class="m" fill="#eeeaf5" font-size="19" font-weight="700">SIMULATION → DERIVATION → DEVICE</text>
<text x="55" y="69" class="m s">AUTHORITATIVE STATE FLOWS OUTWARD; PRESENTATION NEVER BECOMES WORLD TRUTH</text>

<g transform="translate(55 112)">
 <rect class="box" width="205" height="125" rx="14"/><text x="20" y="34" class="h">Definitions</text><text x="20" y="63" class="m s">math/ · constants</text><text x="20" y="85" class="m s">types · pure functions</text><text x="20" y="107" class="m s">immutable vocabulary</text>
</g>
<g transform="translate(295 112)">
 <rect class="box" width="205" height="125" rx="14"/><text x="20" y="34" class="h">Physics</text><text x="20" y="63" class="m s">orbit · gravity · CR3BP</text><text x="20" y="85" class="m s">attitude · thermal</text><text x="20" y="107" class="m s">THREE.js independent</text>
</g>
<g transform="translate(535 112)">
 <rect class="box" width="205" height="125" rx="14"/><text x="20" y="34" class="h">Game model</text><text x="20" y="63" class="m s">authoritative mutable state</text><text x="20" y="85" class="m s">commands · events</text><text x="20" y="107" class="m s">simulation progression</text>
</g>
<g transform="translate(775 112)">
 <rect class="box" width="205" height="125" rx="14"/><text x="20" y="34" class="h">Presentation</text><text x="20" y="63" class="m s">derived every frame</text><text x="20" y="85" class="m s">HUD · markers · lines</text><text x="20" y="107" class="m s">declarations, not truth</text>
</g>
<g transform="translate(1015 112)">
 <rect class="box" width="130" height="125" rx="14"/><text x="18" y="34" class="h">Devices</text><text x="18" y="63" class="m s">WebGPU</text><text x="18" y="85" class="m s">DOM</text><text x="18" y="107" class="m s">Audio</text>
</g>
<path class="arrow" d="M260 174H292"/><path class="arrow" d="M500 174H532"/><path class="arrow" d="M740 174H772"/><path class="arrow" d="M980 174H1012"/>

<g transform="translate(55 286)">
 <rect width="1090" height="78" rx="12" fill="#0e1014" stroke="#48506a"/>
 <text x="20" y="28" class="m s">FRAME PHASES</text>
 <text x="20" y="56" class="m" fill="#eeeaf5" font-size="17">INPUT INTERPRETATION  →  SIMULATION  →  PRESENTATION SYNC  →  RENDER</text>
</g>
</svg>