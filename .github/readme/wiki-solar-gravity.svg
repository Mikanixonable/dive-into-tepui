<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>天体ごとの物理</title><desc>形状・重力・自転を一つの前提に揃える</desc><defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.accent{fill:none;stroke:#ff3155;stroke-width:2}.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker></defs><rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">天体ごとの物理</text><text x="55" y="72" class="m d k">形状・重力・自転を一つの前提に揃える</text><g transform="translate(55.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">重力</text><text x="18" y="62" class="sans t v">μ・J2・C22</text><text x="18" y="91" class="m d sm">点質量だけではない</text><text x="18" y="115" class="m d sm">天体ごとに係数</text></g><g transform="translate(333.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">形状</text><text x="18" y="62" class="sans t v">半径・扁平</text><text x="18" y="91" class="m d sm">接触・高度</text><text x="18" y="115" class="m d sm">表示とも共有</text></g><g transform="translate(611.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">自転</text><text x="18" y="62" class="sans t v">pole / phase</text><text x="18" y="91" class="m d sm">大気相対速度</text><text x="18" y="115" class="m d sm">固定座標系</text></g><g transform="translate(889.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">照明</text><text x="18" y="62" class="sans t v">太陽方向</text><text x="18" y="91" class="m d sm">食・影・SRP</text><text x="18" y="115" class="m d sm">描画と物理で利用</text></g><text x="55" y="400" class="m b sm">同じ天体について別々の時刻・座標前提を持たない。</text></svg>