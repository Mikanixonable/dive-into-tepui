<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>天体を画面へ写す</title><desc>同じ天体状態から距離に応じた表現を導出</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.s{fill:#3478ff}
.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.soft{fill:#15171c}.line{fill:none;stroke:#89838f;stroke-width:1.5}.accent{fill:none;stroke:#ff3155;stroke-width:2}.signal{fill:none;stroke:#3478ff;stroke-width:2}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}.xs{font-size:10px;letter-spacing:.8px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">天体を画面へ写す</text><text x="55" y="72" class="m d k">同じ天体状態から距離に応じた表現を導出</text><g transform="translate(55.0 125)"><rect width="257.5" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">01</text><text x="18" y="61" class="sans t v">天体状態</text><text x="18" y="90" class="m d sm">position / radius</text><text x="18" y="114" class="m d sm">orientation</text></g><path d="M315.5 197H327.5" class="accent" marker-end="url(#arrR)"/><g transform="translate(332.5 125)"><rect width="257.5" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">02</text><text x="18" y="61" class="sans t v">表現選択</text><text x="18" y="90" class="m d sm">sphere / point</text><text x="18" y="114" class="m d sm">LOD</text></g><path d="M593 197H605" class="accent" marker-end="url(#arrR)"/><g transform="translate(610.0 125)"><rect width="257.5" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">03</text><text x="18" y="61" class="sans t v">表面</text><text x="18" y="90" class="m d sm">texture / terrain</text><text x="18" y="114" class="m d sm">lighting</text></g><path d="M870.5 197H882.5" class="accent" marker-end="url(#arrR)"/><g transform="translate(887.5 125)"><rect width="257.5" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">04</text><text x="18" y="61" class="sans t v">UI</text><text x="18" y="90" class="m d sm">marker / label</text><text x="18" y="114" class="m d sm">orbit guide</text></g><text x="55" y="324" class="m b sm">実寸・物理状態と、遠距離で見やすくする schematic 表現を分ける。</text></svg>