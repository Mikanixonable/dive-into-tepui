<rect width="1200" height="260" rx="20" fill="url(#bg)"/>
<text x="40" y="38" class="m t h">WebGPU・描画・データ基盤</text><text x="40" y="60" class="m d sm">表示宣言と巨大データの供給を別経路で Scene に合流させる</text>
