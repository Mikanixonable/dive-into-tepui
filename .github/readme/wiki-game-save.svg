<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img"><title>保存・設定・起動</title><defs><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.u{fill:#3478ff}
.g{fill:none;stroke:#48506a;stroke-width:1.2}.w{fill:none;stroke:#89838f;stroke-width:1.4}.r{fill:none;stroke:#ff3155;stroke-width:2}.bl{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:6 6}
.h{font-size:20px;font-weight:700}.v{font-size:14px;font-weight:650}.sm{font-size:11px}.xs{font-size:9px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".34" cy=".28" r=".82"><stop stop-color="#d8d9dc"/><stop offset=".5" stop-color="#536178"/><stop offset="1" stop-color="#171a20"/></radialGradient>
<marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="260" rx="20" fill="url(#bg)"/>
<text x="40" y="38" class="m t h">保存・設定・起動</text><text x="40" y="60" class="m d sm">寿命の違いを3列に分け、何を保存し何を再生成するかを明確にする</text>
<g transform="translate(70 92)">
 <rect width="300" height="122" rx="12" fill="#101217" stroke="#ff3155"/>
 <text x="18" y="25" class="m a v">RUN / SAVE</text>
 <text x="18" y="50" class="m t sm">Game · Dynamic entities</text><text x="18" y="71" class="m t sm">Viewer · Stage · Plan</text>
 <text x="18" y="103" class="m d xs">→ snapshot に保存</text>
</g>
<g transform="translate(450 92)">
 <rect width="300" height="122" rx="12" fill="#101217" stroke="#3478ff"/>
 <text x="18" y="25" class="m u v">SNAPSHOT / SLOT</text>
 <path d="M18 43h66v42H18z" fill="none" stroke="#3478ff"/><path d="M96 48h170M96 66h128M96 84h148" class="g"/>
 <text x="18" y="106" class="m d xs">serialize → localStorage / export</text>
</g>
<g transform="translate(830 92)">
 <rect width="300" height="122" rx="12" fill="#101217" stroke="#ff8798"/>
 <text x="18" y="25" class="m a v">APP LIFETIME</text>
 <text x="18" y="50" class="m t sm">Settings · Launcher</text><text x="18" y="71" class="m t sm">theme · graphics · BGM</text>
 <text x="18" y="103" class="m d xs">GPU / DOM は保存せず再構築</text>
</g>
<path d="M370 153H448M750 153H828" class="g" marker-end="url(#ba)"/>
</svg>