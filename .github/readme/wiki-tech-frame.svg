<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>1フレームの流れ</title><desc>Run.frameを中心に、入力、進行、表示導出、描画が円環状に繰り返される様子。</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.sig{fill:#3478ff}
.stroke{fill:none;stroke:#89838f;stroke-width:1.6}.soft{fill:none;stroke:#48506a;stroke-width:1.2}.accent{fill:none;stroke:#ff3155;stroke-width:2.4}.blue{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:8 8}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.2px}.v{font-size:16px;font-weight:650}.sm{font-size:12px}.xs{font-size:10px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".35" cy=".28" r=".8"><stop stop-color="#d6d6d0"/><stop offset=".55" stop-color="#48506a"/><stop offset="1" stop-color="#161a20"/></radialGradient>
<radialGradient id="sun" cx=".35" cy=".35" r=".8"><stop stop-color="#fff1f4"/><stop offset=".28" stop-color="#ff6b82"/><stop offset="1" stop-color="#ff3155"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">1フレームの流れ</text><text x="55" y="72" class="m d k">イベント順ではなく、決められた位相順に世界を進める</text>
<g transform="translate(600 270)">
  <circle r="145" fill="none" stroke="#48506a" stroke-width="32" opacity=".55"/>
  <circle r="78" fill="#0e1014" stroke="#ff3155" stroke-width="2.2"/>
  <text x="-40" y="-4" class="m a k">RUN</text><text x="-52" y="22" class="s t v">frame()</text>
  <path d="M0-160A160 160 0 0 1 160 0" class="accent" marker-end="url(#ra)"/>
  <path d="M160 0A160 160 0 0 1 0 160" class="accent" marker-end="url(#ra)"/>
  <path d="M0 160A160 160 0 0 1 -160 0" class="accent" marker-end="url(#ra)"/>
  <path d="M-160 0A160 160 0 0 1 0-160" class="accent" marker-end="url(#ra)"/>
</g>
<g class="m">
  <circle cx="600" cy="105" r="38" fill="#15171c" stroke="#3478ff"/><text x="577" y="110" class="t sm">入力</text><text x="560" y="130" class="d xs">interpret</text>
  <circle cx="765" cy="270" r="38" fill="#15171c" stroke="#ff3155"/><text x="742" y="275" class="t sm">進行</text><text x="736" y="295" class="d xs">advance</text>
  <circle cx="600" cy="435" r="38" fill="#15171c" stroke="#ff6b82"/><text x="568" y="440" class="t sm">表示導出</text><text x="580" y="460" class="d xs">derive</text>
  <circle cx="435" cy="270" r="38" fill="#15171c" stroke="#3478ff"/><text x="412" y="275" class="t sm">描画</text><text x="415" y="295" class="d xs">render</text>
</g>
<g transform="translate(855 335)">
  <path d="M0 0h180v72H0z" fill="#0e1014" stroke="#48506a"/>
  <path d="M20 20h48v32H20z" fill="none" stroke="#ff3155"/><path d="M76 20h84v8H76M76 37h62v8H76" class="soft"/>
  <text x="18" y="-12" class="m d xs">SAVE POINT</text><text x="20" y="66" class="m b sm">進行後 / 同期前</text>
</g>
<g transform="translate(115 175)"><path d="M0 0C50-38 100-38 150 0C100 38 50 38 0 0Z" fill="none" stroke="#48506a"/><circle cx="75" cy="0" r="13" fill="#3478ff"/><text x="33" y="70" class="m b sm">browser events</text></g>
</svg>