<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>雲場の生成</title><desc>気象状態から形・高度・光学量を作る</desc><defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.accent{fill:none;stroke:#ff3155;stroke-width:2}.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">雲場の生成</text><text x="55" y="72" class="m d k">気象状態から形・高度・光学量を作る</text><g transform="translate(55.0 125)"><rect width="202.0" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">01</text><text x="18" y="61" class="sans t v">輸送</text><text x="18" y="90" class="m d sm">weather transport</text><text x="18" y="114" class="m d sm">風で移流</text></g><path d="M260 197H272" class="accent" marker-end="url(#arrR)"/><g transform="translate(277.0 125)"><rect width="202.0" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">02</text><text x="18" y="61" class="sans t v">凝結</text><text x="18" y="90" class="m d sm">condensation</text><text x="18" y="114" class="m d sm">雲量を生成</text></g><path d="M482 197H494" class="accent" marker-end="url(#arrR)"/><g transform="translate(499.0 125)"><rect width="202.0" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">03</text><text x="18" y="61" class="sans t v">鉛直構造</text><text x="18" y="90" class="m d sm">height profile</text><text x="18" y="114" class="m d sm">雲底・雲頂</text></g><path d="M704 197H716" class="accent" marker-end="url(#arrR)"/><g transform="translate(721.0 125)"><rect width="202.0" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">04</text><text x="18" y="61" class="sans t v">形状</text><text x="18" y="90" class="m d sm">cumulus / noise</text><text x="18" y="114" class="m d sm">局地構造</text></g><path d="M926 197H938" class="accent" marker-end="url(#arrR)"/><g transform="translate(943.0 125)"><rect width="202.0" height="145" rx="15" class="box"/><text x="18" y="30" class="m a k">05</text><text x="18" y="61" class="sans t v">光学</text><text x="18" y="90" class="m d sm">opacity / density</text><text x="18" y="114" class="m d sm">描画入力</text></g><text x="55" y="324" class="m b sm">気象状態と最終ピクセルの間に雲場を置く。</text></svg>