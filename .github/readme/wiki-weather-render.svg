<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>雲場と描画</title><desc>地球断面、低層雲、薄雲、大気散乱、太陽光、カメラ視線を重ねて最終描画を示す。</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.sig{fill:#3478ff}
.stroke{fill:none;stroke:#89838f;stroke-width:1.6}.soft{fill:none;stroke:#48506a;stroke-width:1.2}.accent{fill:none;stroke:#ff3155;stroke-width:2.4}.blue{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:8 8}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.2px}.v{font-size:16px;font-weight:650}.sm{font-size:12px}.xs{font-size:10px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".35" cy=".28" r=".8"><stop stop-color="#d6d6d0"/><stop offset=".55" stop-color="#48506a"/><stop offset="1" stop-color="#161a20"/></radialGradient>
<radialGradient id="sun" cx=".35" cy=".35" r=".8"><stop stop-color="#fff1f4"/><stop offset=".28" stop-color="#ff6b82"/><stop offset="1" stop-color="#ff3155"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">雲場と描画</text><text x="55" y="72" class="m d k">気象場を、密度・高度・散乱・透過率を経て画面の光へ変える</text>
<g transform="translate(410 300)">
  <circle r="150" fill="url(#earth)" stroke="#d6d6d0"/>
  <circle r="172" fill="none" stroke="#3478ff" stroke-width="12" opacity=".18"/>
  <path d="M-118-70C-85-93-50-95-18-75C13-55 48-57 80-77C106-93 127-87 144-72" fill="none" stroke="#eeeaf5" stroke-width="20" stroke-linecap="round" opacity=".72"/>
  <path d="M-92-116C-58-132-18-130 20-116C52-104 91-103 122-115" fill="none" stroke="#c3bec9" stroke-width="8" stroke-linecap="round" opacity=".36"/>
  <text x="-142" y="-48" class="m t sm">不透明雲</text><text x="-80" y="-137" class="m b sm">薄雲</text>
</g>
<g transform="translate(965 135)">
  <circle r="42" fill="url(#sun)" filter="url(#glow)"/><text x="-25" y="70" class="m an sm">太陽</text>
  <path d="M-45 35L-382 130M-35 45L-360 195M-55 20L-400 75" stroke="#ff6b82" stroke-width="2" opacity=".7"/>
</g>
<g transform="translate(930 360)">
  <path d="M-22-10L28 0-22 10-5 0Z" fill="#eeeaf5"/><circle r="24" fill="none" stroke="#3478ff"/>
  <path d="M-26-5L-410-70" class="blue dash"/><text x="-165" y="-38" class="m sig sm">camera ray</text>
</g>
<g transform="translate(650 145)">
  <path d="M0 0C52 28 86 68 108 118" class="soft"/><text x="0" y="-10" class="m d sm">Rayleigh / Mie</text>
  <path d="M50 145C82 163 112 168 148 168" class="accent"/><text x="104" y="194" class="m a sm">ray marching</text>
</g>
<text x="55" y="480" class="m b sm">地表・雲・大気光・オーロラは別レイヤーで作り、最後に合成する。</text>
</svg>