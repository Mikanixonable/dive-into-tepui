<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>CR3BP とラグランジュ点</title><desc>二天体系の回転座標で航法構造を見る</desc><defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.accent{fill:none;stroke:#ff3155;stroke-width:2}.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker></defs><rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">CR3BP とラグランジュ点</text><text x="55" y="72" class="m d k">二天体系の回転座標で航法構造を見る</text><g transform="translate(55.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">L1</text><text x="18" y="62" class="sans t v">主副天体の間</text><text x="18" y="91" class="m d sm">回転系で固定</text><text x="18" y="115" class="m d sm">通過・近傍軌道</text></g><g transform="translate(333.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">L2</text><text x="18" y="62" class="sans t v">副天体の外側</text><text x="18" y="91" class="m d sm">回転系で固定</text><text x="18" y="115" class="m d sm">Halo/NRHO 周辺</text></g><g transform="translate(611.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">L4 / L5</text><text x="18" y="62" class="sans t v">正三角形方向</text><text x="18" y="91" class="m d sm">条件付き安定</text><text x="18" y="115" class="m d sm">地図上の基準</text></g><g transform="translate(889.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">Jacobi</text><text x="18" y="62" class="sans t v">ゼロ速度境界</text><text x="18" y="91" class="m d sm">到達可能領域</text><text x="18" y="115" class="m d sm">エネルギー構造</text></g><text x="55" y="400" class="m b sm">L点は自動遷移先ではなく、航法と軌道設計の基準。</text></svg>