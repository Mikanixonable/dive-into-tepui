<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>状態とアーキテクチャ</title><desc>正本モデルを中心に、物理、表示導出、装置の依存関係を同心円状に示す。</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.sig{fill:#3478ff}
.stroke{fill:none;stroke:#89838f;stroke-width:1.6}.soft{fill:none;stroke:#48506a;stroke-width:1.2}.accent{fill:none;stroke:#ff3155;stroke-width:2.4}.blue{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:8 8}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.2px}.v{font-size:16px;font-weight:650}.sm{font-size:12px}.xs{font-size:10px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".35" cy=".28" r=".8"><stop stop-color="#d6d6d0"/><stop offset=".55" stop-color="#48506a"/><stop offset="1" stop-color="#161a20"/></radialGradient>
<radialGradient id="sun" cx=".35" cy=".35" r=".8"><stop stop-color="#fff1f4"/><stop offset=".28" stop-color="#ff6b82"/><stop offset="1" stop-color="#ff3155"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">状態とアーキテクチャ</text><text x="55" y="72" class="m d k">正本を中心に、再生成可能な層を外側へ置く</text>
<g transform="translate(585 278)">
  <circle r="170" fill="#0e1014" stroke="#1d2026" stroke-width="26"/>
  <circle r="118" fill="#15171c" stroke="#48506a" stroke-width="1.6"/>
  <circle r="66" fill="#0e1014" stroke="#ff3155" stroke-width="2.4"/>
  <text x="-34" y="-10" class="m a k">正本</text><text x="-52" y="18" class="s t v">GAME MODEL</text>
  <text x="-82" y="-88" class="m b sm">physics / time</text>
  <text x="-87" y="108" class="m d sm">presentation</text>
  <path d="M-42-51L-77-92M42-51L76-92M-51 42L-90 75M51 42L92 75" class="soft"/>
  <circle cx="-100" cy="-118" r="9" class="sig"/><circle cx="102" cy="-118" r="9" class="sig"/>
  <circle cx="-124" cy="100" r="9" class="a"/><circle cx="126" cy="100" r="9" class="a"/>
  <text x="-160" y="-140" class="m d xs">math</text><text x="117" y="-140" class="m d xs">physics</text>
  <text x="-190" y="128" class="m d xs">HUD / lines</text><text x="142" y="128" class="m d xs">markers</text>
</g>
<g>
  <circle cx="230" cy="165" r="32" fill="#0e1014" stroke="#3478ff"/><text x="203" y="171" class="m t sm">INPUT</text>
  <circle cx="950" cy="155" r="32" fill="#0e1014" stroke="#3478ff"/><text x="928" y="161" class="m t sm">DOM</text>
  <circle cx="1010" cy="330" r="32" fill="#0e1014" stroke="#3478ff"/><text x="984" y="336" class="m t sm">AUDIO</text>
  <circle cx="225" cy="350" r="32" fill="#0e1014" stroke="#3478ff"/><text x="198" y="356" class="m t sm">WebGPU</text>
  <path d="M262 165C355 135 405 120 455 138" class="blue dash"/>
  <path d="M715 150C790 122 858 126 918 155" class="blue dash"/>
  <path d="M722 330C815 356 900 355 978 330" class="blue dash"/>
  <path d="M447 354C360 384 298 378 257 350" class="blue dash"/>
</g>
<text x="55" y="455" class="m b sm">内側ほど捨てにくい。外側ほど再生成できる。装置はゲーム上の意味を所有しない。</text>
</svg>