 <text x="0" y="0" class="m a sm">軌道摂動</text><text x="0" y="25" class="m b sm">J2 / C22</text><text x="0" y="47" class="m b sm">drag / SRP</text><text x="0" y="69" class="m b sm">third-body gravity</text>
