<marker id="ba" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker></defs>
<rect width="1200" height="260" rx="20" fill="url(#bg)"/>
<text x="40" y="38" class="m t h">重力・摂動・環境力</text><text x="40" y="60" class="m d sm">模式図 — 力の向きと役割を分け、同じ状態方程式へ合成する</text>
<g transform="translate(390 158)">
 <ellipse rx="78" ry="70" fill="url(#earth)" stroke="#c3bec9"/><ellipse rx="95" ry="24" class="r dash"/>
