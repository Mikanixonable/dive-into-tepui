  <path d="M1045 246C930 278 850 223 760 252C660 285 570 226 470 256C370 286 275 225 180 254C110 275 60 270 20 255" fill="none" stroke="#ff3155" stroke-width="3" marker-end="url(#ra)"/>
  <g transform="translate(330 150)"><path d="M0 0C18-28 50-35 76-20C100-6 100 24 78 42C54 62 20 53 4 28C-8 10-6-10 8-25" class="accent"/><circle r="5" fill="#ff3155"/></g>
  <g transform="translate(800 168)"><path d="M0 0C18-28 50-35 76-20C100-6 100 24 78 42C54 62 20 53 4 28C-8 10-6-10 8-25" class="accent"/><circle r="5" fill="#ff3155"/></g>
  <text x="30" y="42" class="m a xs">偏西風 + Rossby 波</text><text x="30" y="145" class="m sig xs">貿易風</text><text x="30" y="287" class="m a xs">偏西風</text>
</g>
