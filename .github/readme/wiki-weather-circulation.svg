<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><title>大気循環</title><desc>大域風と局地対流を別のスケールで重ねる</desc><defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.sans{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.accent{fill:none;stroke:#ff3155;stroke-width:2}.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker></defs><rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">大気循環</text><text x="55" y="72" class="m d k">大域風と局地対流を別のスケールで重ねる</text><g transform="translate(55.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">大域風</text><text x="18" y="62" class="sans t v">緯度帯・偏西風</text><text x="18" y="91" class="m d sm">長波長の流れ</text><text x="18" y="115" class="m d sm">雲系を輸送</text></g><g transform="translate(333.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">Rossby 波</text><text x="18" y="62" class="sans t v">蛇行</text><text x="18" y="91" class="m d sm">中緯度変動</text><text x="18" y="115" class="m d sm">前線帯の形</text></g><g transform="translate(611.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">低気圧</text><text x="18" y="62" class="sans t v">cyclone tracks</text><text x="18" y="91" class="m d sm">渦度・収束</text><text x="18" y="115" class="m d sm">組織化した雲</text></g><g transform="translate(889.0 115)"><rect width="256.0" height="220" rx="15" class="box"/><text x="18" y="30" class="m a k">対流</text><text x="18" y="62" class="sans t v">convective activity</text><text x="18" y="91" class="m d sm">短寿命・局地</text><text x="18" y="115" class="m d sm">積雲の発達</text></g><text x="55" y="400" class="m b sm">一つのノイズ場だけで全球の雲運動を表さない。</text></svg>