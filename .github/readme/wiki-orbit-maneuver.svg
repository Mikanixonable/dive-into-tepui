<marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker></defs><rect width="1200" height="285" rx="22" fill="url(#bg)"/><text x="55" y="48" class="m t h">マニューバと予測</text><text x="55" y="72" class="m d k">ノードを編集し、未来軌道を需要に応じて再計算する</text><rect x="55" y="116" width="246.25" height="108" rx="14" class="box"/><text x="73" y="150" class="s t v">現在状態</text><text x="73" y="177" class="m d sm">位置・速度</text><text x="73" y="200" class="m d sm">正本</text><rect x="336.25" y="116" width="246.25" height="108" rx="14" class="box"/><text x="354.25" y="150" class="s t v">ノード</text><text x="354.25" y="177" class="m d sm">時刻 + Δv</text><text x="354.25" y="200" class="m d sm">3軸編集</text><rect x="617.5" y="116" width="246.25" height="108" rx="14" class="box"/><text x="635.5" y="150" class="s t v">予測</text><text x="635.5" y="177" class="m d sm">上流から再計算</text><text x="635.5" y="200" class="m d sm">キャッシュ</text><rect x="898.75" y="116" width="246.25" height="108" rx="14" class="box"/><text x="916.75" y="150" class="s t v">表示</text><text x="916.75" y="177" class="m d sm">線・マーカー</text><text x="916.75" y="200" class="m d sm">世界は変えない</text><path d="M307.25 170H330.25" class="acc" marker-end="url(#r)"/><path d="M588.5 170H611.5" class="acc" marker-end="url(#r)"/><path d="M869.75 170H892.75" class="acc" marker-end="url(#r)"/></svg>