</g>
<g transform="translate(690 155)">
 <circle r="64" fill="#81786e" stroke="#c3bec9"/>
 <path d="M-82 0H82M0-82V82" class="g"/>
 <path d="M0-88V-68" class="bl" marker-end="url(#ba)"/>
 <path d="M-92-16C-42-50 42-50 92-16M-92 16C-42 50 42 50 92 16" class="r dash"/>
 <text x="-18" y="88" class="m t v">月</text><text x="-104" y="-55" class="m a xs">J2</text><text x="79" y="-55" class="m a xs">C22</text>
</g>
<g transform="translate(865 103)">
