<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>天体の物理モデル</title><desc>地球と月を並べ、重力場、形状、自転、大気などの属性を視覚化。</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.sig{fill:#3478ff}
.stroke{fill:none;stroke:#89838f;stroke-width:1.6}.soft{fill:none;stroke:#48506a;stroke-width:1.2}.accent{fill:none;stroke:#ff3155;stroke-width:2.4}.blue{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:8 8}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.2px}.v{font-size:16px;font-weight:650}.sm{font-size:12px}.xs{font-size:10px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".35" cy=".28" r=".8"><stop stop-color="#d6d6d0"/><stop offset=".55" stop-color="#48506a"/><stop offset="1" stop-color="#161a20"/></radialGradient>
<radialGradient id="sun" cx=".35" cy=".35" r=".8"><stop stop-color="#fff1f4"/><stop offset=".28" stop-color="#ff6b82"/><stop offset="1" stop-color="#ff3155"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="500" rx="22" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">天体の物理モデル</text><text x="55" y="72" class="m d k">重力・形状・自転・大気は同じ天体定義から参照する</text>
<g transform="translate(330 270)">
  <ellipse rx="120" ry="108" fill="url(#earth)" stroke="#d6d6d0"/>
  <ellipse rx="150" ry="42" class="soft dash"/>
  <path d="M0-145V-112" class="blue" marker-end="url(#ba)"/><text x="12" y="-130" class="m sig sm">自転軸</text>
  <path d="M-170 0H-125M125 0H170" class="accent"/><text x="-220" y="-8" class="m a sm">J2</text>
  <circle r="134" fill="none" stroke="#3478ff" stroke-width="8" opacity=".18"/>
  <text x="-54" y="155" class="m t v">地球</text>
  <text x="-245" y="62" class="m d sm">大気層</text><path d="M-192 58L-125 42" class="soft"/>
  <text x="135" y="74" class="m d sm">楕円体</text><path d="M125 63L96 53" class="soft"/>
</g>
<g transform="translate(835 270)">
  <circle r="82" fill="#7f786e" stroke="#c3bec9"/>
  <path d="M-102 0H102M0-102V102" class="soft"/>
  <path d="M0-122V-84" class="blue" marker-end="url(#ba)"/>
  <path d="M-120-20C-65-65 65-65 120-20M-120 20C-65 65 65 65 120 20" class="accent dash"/>
  <text x="-28" y="124" class="m t v">月</text>
  <text x="-188" y="-84" class="m a sm">J2</text><text x="116" y="-84" class="m an sm">C22</text>
  <text x="-205" y="82" class="m d sm">非軸対称重力</text>
</g>
<g transform="translate(495 385)">
  <path d="M0 0H210" class="soft"/><text x="30" y="24" class="m b sm">μ · 半径 · 楕円体 · pole · phase</text>
</g>
</svg>