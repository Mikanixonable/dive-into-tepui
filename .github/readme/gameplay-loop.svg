<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:system-ui,-apple-system,sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.f{fill:#5f5a65}.a{fill:#ff3155}.an{fill:#ff6b82}.s{fill:#3478ff}
.box{fill:#0e1014;stroke:#48506a;stroke-width:1.4}.soft{fill:#15171c}.line{fill:none;stroke:#89838f;stroke-width:1.5}.accent{fill:none;stroke:#ff3155;stroke-width:2}.signal{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:7 7}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.1px}.v{font-size:16px;font-weight:600}.sm{font-size:12px}.xs{font-size:10px;letter-spacing:.8px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="360" rx="20" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">ゲームプレイループ</text><text x="55" y="72" class="m d k">マップスケールと戦闘スケールは一つの連続した系</text>
<g transform="translate(55 115)">
<rect class="box" width="190" height="145" rx="16"/><text x="18" y="31" class="m a k">01 / 目標</text><text x="18" y="61" class="sans t v">捕捉</text><text x="18" y="87" class="m d sm">目標 / 距離</text><text x="18" y="108" class="m d sm">相対運動</text><circle cx="148" cy="83" r="25" class="signal"/><path d="M148 48V62M148 104V118M113 83H127M169 83H183" stroke="#3478ff"/></g>
<g transform="translate(275 115)"><rect class="box" width="190" height="145" rx="16"/><text x="18" y="31" class="m a k">02 / 計画</text><text x="18" y="61" class="sans t v">軌道を組む</text><text x="18" y="87" class="m d sm">マニューバーノード</text><text x="18" y="108" class="m d sm">PRO / NRM / RAD</text><ellipse cx="147" cy="86" rx="31" ry="17" class="accent" transform="rotate(-18 147 86)"/><circle cx="168" cy="72" r="5" fill="#ff3155"/></g>
<g transform="translate(495 115)"><rect class="box" width="190" height="145" rx="16"/><text x="18" y="31" class="m a k">03 / 時間加速</text><text x="18" y="61" class="sans t v">時間を進める</text><text x="18" y="87" class="m d sm">惰性飛行</text><text x="18" y="108" class="m d sm">ノード時刻</text><text x="128" y="93" class="m t h">×128</text></g>
<g transform="translate(715 115)"><rect class="box" width="190" height="145" rx="16"/><text x="18" y="31" class="m a k">04 / 会合</text><text x="18" y="61" class="sans t v">運動を合わせる</text><text x="18" y="87" class="m d sm">距離を詰める</text><text x="18" y="108" class="m d sm">相対速度が重要</text><circle cx="137" cy="84" r="7" fill="#eeeaf5"/><circle cx="165" cy="66" r="7" fill="#ff3155"/><path d="M144 80L158 70" class="signal" marker-end="url(#arrB)"/></g>
<g transform="translate(935 115)"><rect class="box" width="210" height="145" rx="16"/><text x="18" y="31" class="m a k">05 / 交戦</text><text x="18" y="61" class="sans t v">射撃諸元</text><text x="18" y="87" class="m d sm">見越し照準</text><text x="18" y="108" class="m d sm">実体弾飛翔</text><path d="M126 101L180 60" class="accent" marker-end="url(#arrR)"/><circle cx="180" cy="60" r="9" class="signal"/></g>
<path d="M245 187H270M465 187H490M685 187H710M905 187H930" class="accent" marker-end="url(#arrR)"/>
<text x="55" y="315" class="m b sm">戦闘ビュー：姿勢 / 推力 / 射撃</text><text x="420" y="315" class="m b sm">マップビュー：軌道 / 座標系 / マニューバ</text><text x="850" y="315" class="m b sm">時間加速が両スケールをつなぐ</text>
</svg>