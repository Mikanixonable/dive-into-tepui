<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>UI・入力・カメラ</title><desc>中央のゲーム画面をHUDパネルと入力ルータ、Viewer、カメラが囲む模式図。</desc><defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic",monospace}.s{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.t{fill:#eeeaf5}.b{fill:#c3bec9}.d{fill:#89838f}.a{fill:#ff3155}.an{fill:#ff6b82}.sig{fill:#3478ff}
.stroke{fill:none;stroke:#89838f;stroke-width:1.6}.soft{fill:none;stroke:#48506a;stroke-width:1.2}.accent{fill:none;stroke:#ff3155;stroke-width:2.4}.blue{fill:none;stroke:#3478ff;stroke-width:2}.dash{stroke-dasharray:8 8}
.h{font-size:22px;font-weight:700}.k{font-size:13px;letter-spacing:1.2px}.v{font-size:16px;font-weight:650}.sm{font-size:12px}.xs{font-size:10px}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15171c"/></linearGradient>
<radialGradient id="earth" cx=".35" cy=".28" r=".8"><stop stop-color="#d6d6d0"/><stop offset=".55" stop-color="#48506a"/><stop offset="1" stop-color="#161a20"/></radialGradient>
<marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ff3155"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3478ff"/></marker>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<text x="55" y="48" class="m t h">UI・入力・カメラ</text><text x="55" y="72" class="m d k">画面はモデルの写像。入力は優先順位を通って命令へ変わる</text>
<g transform="translate(250 120)">
  <rect width="700" height="330" rx="18" fill="#0b0d11" stroke="#48506a"/>
  <rect x="0" y="0" width="700" height="34" rx="18" fill="#15171c"/><text x="18" y="22" class="m t xs">TOP BAR · ORBIT / TARGET / TIME</text>
  <rect x="16" y="54" width="150" height="112" rx="10" fill="#0e1014" stroke="#48506a"/><text x="30" y="78" class="m a xs">SHIP</text><text x="30" y="100" class="m b xs">fuel</text><text x="30" y="120" class="m b xs">thermal</text>
  <rect x="534" y="54" width="150" height="112" rx="10" fill="#0e1014" stroke="#48506a"/><text x="548" y="78" class="m a xs">TARGET</text><text x="548" y="100" class="m b xs">range</text><text x="548" y="120" class="m b xs">relative v</text>
  <rect x="16" y="216" width="175" height="92" rx="10" fill="#0e1014" stroke="#48506a"/><text x="30" y="240" class="m sig xs">MAP / FRAME</text><text x="30" y="262" class="m b xs">ECI · rotating</text>
  <circle cx="350" cy="190" r="72" fill="url(#earth)" stroke="#d6d6d0"/><ellipse cx="350" cy="190" rx="170" ry="85" class="soft"/><circle cx="475" cy="130" r="7" fill="#ff3155"/>
  <path d="M350 190L438 115" class="blue" marker-end="url(#ba)"/><path d="M350 190V85" class="accent" marker-end="url(#ra)"/>
  <circle cx="350" cy="190" r="7" fill="#eeeaf5"/>
</g>
<g transform="translate(65 190)">
  <circle cx="70" cy="70" r="58" fill="#15171c" stroke="#3478ff"/>
  <path d="M43 70H97M70 43V97" class="soft"/><circle cx="70" cy="70" r="10" fill="#3478ff"/>
  <text x="28" y="148" class="m b sm">Raw Input</text>
  <path d="M130 70C180 70 190 92 205 118" class="blue" marker-end="url(#ba)"/>
</g>
<g transform="translate(985 190)">
  <circle cx="70" cy="70" r="58" fill="#15171c" stroke="#ff3155"/>
  <path d="M70 20L95 70L70 120L45 70Z" fill="none" stroke="#ff3155"/>
  <text x="42" y="148" class="m b sm">Viewer</text>
  <path d="M5 70C-40 70-58 92-68 118" class="accent" marker-end="url(#ra)"/>
</g>
<text x="55" y="482" class="m b sm">input/ = 生入力 · GameInputRouter = 意味付け · Viewer = セーブごとの見方 · HUD/Camera = 導出</text>
</svg>