<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Dive into Tepui orbital combat banner</title>
<desc id="desc">A stylized Earth with multiple orbital trajectories, spacecraft markers, maneuver nodes and telemetry labels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.55" stop-color="#0d1b2f"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <radialGradient id="earth" cx="38%" cy="30%" r="70%">
    <stop offset="0" stop-color="#8bd4ff"/>
    <stop offset="0.45" stop-color="#2d84c4"/>
    <stop offset="0.78" stop-color="#184d77"/>
    <stop offset="1" stop-color="#071b2a"/>
  </radialGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#73e0ff" stop-opacity=".18"/>
    <stop offset=".5" stop-color="#73e0ff" stop-opacity=".95"/>
    <stop offset="1" stop-color="#73e0ff" stop-opacity=".18"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .label{font-size:14px;fill:#9fb3c8;letter-spacing:1.2px}
    .value{font-size:18px;fill:#e8f6ff;font-weight:700}
    .thin{stroke:#2a4662;stroke-width:1;fill:none}
  </style>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<g opacity=".35">
  <path d="M0 78H1200M0 156H1200M0 234H1200M0 312H1200M0 390H1200M0 468H1200" stroke="#17304a"/>
  <path d="M120 0V520M240 0V520M360 0V520M480 0V520M600 0V520M720 0V520M840 0V520M960 0V520M1080 0V520" stroke="#122a41"/>
</g>

<g transform="translate(370 278)">
  <circle r="118" fill="#102538" opacity=".8" filter="url(#glow)"/>
  <circle r="103" fill="url(#earth)"/>
  <path d="M-82 -44C-38 -80 7 -88 51 -64 80 -48 93 -20 96 3 65 -11 37 -8 8 10 -21 28 -48 29 -80 8-91 -4-95-22-82-44Z" fill="#5a9c72" opacity=".82"/>
  <path d="M-55 44C-21 25 18 24 58 49 41 77 12 95-23 98-45 87-56 70-55 44Z" fill="#4c8764" opacity=".72"/>
  <ellipse rx="155" ry="69" class="thin" transform="rotate(-17)"/>
  <ellipse rx="210" ry="92" fill="none" stroke="url(#orbit)" stroke-width="2.4" transform="rotate(12)"/>
  <ellipse rx="276" ry="116" fill="none" stroke="#7c5cff" stroke-width="1.6" stroke-dasharray="9 8" opacity=".72" transform="rotate(-7)"/>
  <circle cx="192" cy="-34" r="5" fill="#7ee7ff" filter="url(#glow)"/>
  <circle cx="-242" cy="56" r="4" fill="#a78bfa" filter="url(#glow)"/>
</g>

<g transform="translate(775 193)">
  <path d="M-13 -7L21 0-13 7-4 0Z" fill="#e8f6ff"/>
  <circle r="21" fill="none" stroke="#7ee7ff" stroke-width="1.6" opacity=".75"/>
  <path d="M0-32V-20M0 20V32M-32 0H-20M20 0H32" stroke="#7ee7ff"/>
  <text x="42" y="-4" class="mono label">PLAYER</text>
  <text x="42" y="18" class="mono value">Δv  18.4 m/s</text>
</g>

<g transform="translate(995 324)">
  <path d="M-10 -10L12 0-10 10-3 0Z" fill="#ff7a90"/>
  <circle r="17" fill="none" stroke="#ff7a90" opacity=".7"/>
  <text x="-145" y="-7" class="mono label">TARGET</text>
  <text x="-145" y="16" class="mono value">REL  224 m/s</text>
</g>

<path d="M790 201C850 228 918 267 983 316" fill="none" stroke="#ff7a90" stroke-width="1.6" stroke-dasharray="6 7" opacity=".78"/>
<path d="M786 189C843 142 925 126 1026 151" fill="none" stroke="#7ee7ff" stroke-width="1.8" opacity=".8"/>

<g transform="translate(72 70)">
  <text class="mono" font-size="16" fill="#7ee7ff" letter-spacing="3">DIVE INTO TEPUI</text>
  <text y="47" font-family="system-ui,-apple-system,sans-serif" font-size="37" fill="#ffffff" font-weight="700">ORBITAL MECHANICS</text>
  <text y="87" font-family="system-ui,-apple-system,sans-serif" font-size="37" fill="#ffffff" font-weight="700">IS THE BATTLEFIELD.</text>
  <text y="126" class="mono label">WEBGPU · TYPESCRIPT · THREE.JS · RK4 · CR3BP</text>
</g>

<g transform="translate(72 405)">
  <rect width="300" height="64" rx="10" fill="#0b1726" stroke="#26445f"/>
  <text x="18" y="24" class="mono label">ALTITUDE</text>
  <text x="18" y="49" class="mono value">420.3 km</text>
  <text x="150" y="24" class="mono label">SPEED</text>
  <text x="150" y="49" class="mono value">7.67 km/s</text>
</g>
<g transform="translate(392 405)">
  <rect width="300" height="64" rx="10" fill="#0b1726" stroke="#26445f"/>
  <text x="18" y="24" class="mono label">TIME WARP</text>
  <text x="18" y="49" class="mono value">×128</text>
  <text x="150" y="24" class="mono label">FRAME</text>
  <text x="150" y="49" class="mono value">ECI</text>
</g>
<g transform="translate(712 405)">
  <rect width="416" height="64" rx="10" fill="#0b1726" stroke="#26445f"/>
  <text x="18" y="24" class="mono label">MISSION PROFILE</text>
  <text x="18" y="49" class="mono value">PLAN → BURN → RENDEZVOUS → ENGAGE</text>
</g>
</svg>