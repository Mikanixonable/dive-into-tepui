<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>BGM Lab</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --edge: #2a3038;
    --text: #d7dde5; --dim: #7d8894; --accent: #ff6a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    font: 13px/1.6 "JetBrains Mono", ui-monospace, monospace;
  }
  h1 { font-size: 15px; margin: 0 0 16px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  label { color: var(--dim); }
  select, input[type=number] {
    background: #0e1216; color: var(--text); border: 1px solid var(--edge);
    border-radius: 4px; padding: 5px 8px; font: inherit;
  }
  input[type=number] { width: 92px; }
  select { min-width: 260px; }
  button {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge);
    border-radius: 4px; padding: 6px 16px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #3d4650; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #12151a; font-weight: 600; }
  #mutes { display: flex; gap: 14px; flex-wrap: wrap; }
  #mutes label { color: var(--text); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #mutes label.off { color: #56606b; text-decoration: line-through; }
  #readout { white-space: pre-wrap; color: var(--dim); }
  #readout b { color: var(--accent); font-weight: 600; }
  #hint { color: var(--accent); min-height: 1.6em; }
  kbd {
    background: #0e1216; border: 1px solid var(--edge); border-radius: 3px;
    padding: 1px 5px; color: var(--dim);
  }
</style>
</head>
<body>
  <h1>BGM Lab <span>— tracks.ts を保存すると再読込されます</span></h1>

  <div class="panel">
    <div class="row">
      <label for="track">曲</label>
      <select id="track"></select>
      <button id="play" class="primary">▶ 再生</button>
      <button id="stop">■ 停止</button>
    </div>
    <div class="row">
      <label for="start">開始ステップ</label>
      <input id="start" type="number" min="0" step="1" value="0">
      <label><input id="loop" type="checkbox"> 区間ループ</label>
      <input id="from" type="number" min="0" step="1" value="0">
      <label>〜</label>
      <input id="to" type="number" min="0" step="1" value="64">
      <label for="vol">音量</label>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
    </div>
  </div>

  <div class="panel">
    <div class="row"><label>声部(クリックで抜き差し)</label></div>
    <div id="mutes"></div>
  </div>

  <div class="panel">
    <div id="readout">停止中</div>
  </div>

  <div class="panel">
    <div id="hint"></div>
    <div style="color:var(--dim)">
      <kbd>Space</kbd> 再生/停止 &nbsp; <kbd>1</kbd>…<kbd>9</kbd> 声部の抜き差し &nbsp;
      <kbd>0</kbd> 全部戻す &nbsp; <kbd>Enter</kbd> 開始ステップから鳴らし直す
    </div>
  </div>
</body>
</html>
