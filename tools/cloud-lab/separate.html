<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cloud Separate</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181d; --edge: #2a3038; --text: #d7dde5; --accent: #ff6a00; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 13px/1.6 "JetBrains Mono", ui-monospace, monospace;
  }
  h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; letter-spacing: .04em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .row button {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge);
    border-radius: 4px; padding: 5px 14px; font: inherit; cursor: pointer;
  }
  .row button:hover { border-color: #3d4650; }
  .row button.active { background: var(--accent); border-color: var(--accent); color: #12151a; font-weight: 600; }
  .row .field { display: flex; align-items: center; gap: 6px; }
  .row .field span { opacity: .7; }
  .row .field input[type=range] { width: 200px; accent-color: var(--accent); }
  .row .field output { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  .row textarea {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge); border-radius: 4px;
    font: inherit; width: 900px; max-width: 100%; height: 44px; padding: 4px 8px; resize: vertical;
  }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--edge); padding: 8px; width: fit-content; }
  figure canvas { display: block; width: 1800px; max-width: 100%; height: auto; background: #000; }
  #error { color: #ff8a5c; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Cloud Separate — 実写を被覆率・雲頂高度・薄い雲へ分離する</h1>
  <div class="row" id="views"></div>
  <div class="row" id="feature"></div>
  <div class="row" id="veil"></div>
  <div class="row" id="top"></div>
  <div class="row" id="params"></div>
  <figure><canvas id="view"></canvas></figure>
  <p id="error"></p>
</body>
</html>
