<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cloud Lab — 雲の細部</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181d; --edge: #2a3038; --text: #d7dde5; --accent: #ff6a00; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 16px; background: var(--bg); color: var(--text);
    font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; gap: 8px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-width: 0; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  p { margin: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--edge); }
  .tabs button, .tabs a {
    background: transparent; color: var(--text); border: 1px solid transparent;
    border-bottom: none; border-radius: 4px 4px 0 0; padding: 4px 18px;
    font: inherit; cursor: pointer; opacity: .65; margin-bottom: -1px;
    text-decoration: none;
  }
  .tabs button:hover, .tabs a:hover { opacity: 1; }
  .tabs button.active, .tabs a.active {
    background: var(--panel); border-color: var(--edge); color: var(--accent);
    opacity: 1; font-weight: 600;
  }
  #status { opacity: .7; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #score { opacity: .7; white-space: nowrap; }
  #error { color: #ff8a5c; white-space: pre-wrap; }
  #status:empty, #score:empty, #error:empty { display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .row-title { opacity: .7; margin-right: 4px; }
  .row button {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge);
    border-radius: 4px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .row button:hover { border-color: #3d4650; }
  .row button:disabled { opacity: .35; cursor: default; }
  .row button.active { background: var(--accent); border-color: var(--accent); color: #12151a; font-weight: 600; }
  .row button.play {
    width: 30px; padding: 3px 0; text-align: center;
    background: var(--accent); border-color: var(--accent); color: #12151a; font-weight: 600;
  }
  .row .field { display: flex; align-items: center; gap: 6px; }
  .row .field span { opacity: .7; }
  .row .field input[type=range] {
    -webkit-appearance: none; appearance: none; width: min(240px, 18vw); height: 14px; margin: 0;
    background: transparent; cursor: pointer;
  }
  .row .field input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--edge); }
  .row .field input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent);
  }
  .row .field input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--edge); }
  .row .field input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--accent); }
  .row .field:has(input[type=checkbox]) { cursor: pointer; }
  .row .field:has(input[type=checkbox]) span { opacity: 1; }
  .row .field output { min-width: 4.5em; font-variant-numeric: tabular-nums; }
  .row .field .scale { position: relative; }
  .row .field .scale > input[type=range] { display: block; width: 100%; }
  .row .field .scale .ticks { position: relative; height: 14px; }
  .row .field .scale .tick {
    position: absolute; top: 0; font-size: 11px; line-height: 14px; white-space: nowrap; opacity: .55;
  }
  .row .field .scale .tick.on { opacity: 1; color: var(--accent); font-weight: 600; }
  #cap { column-gap: 28px; }
  #time .field output { min-width: 7.5em; }
  #score { opacity: .7; white-space: nowrap; }
  #score:empty { display: none; }
  #params { border: 1px solid var(--edge); border-radius: 4px; padding: 0 8px; }
  #params summary { cursor: pointer; opacity: .7; padding: 4px 0; }
  #params[open] summary { border-bottom: 1px solid var(--edge); margin-bottom: 6px; }
  #params .row { padding: 2px 0; }
  #params .row .field input[type=range] { width: min(160px, 14vw); }
  #params textarea {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge); border-radius: 4px;
    font: inherit; width: min(900px, 100%); height: 44px; padding: 4px 8px; resize: vertical;
  }
  #p-panel .tabs { flex-wrap: wrap; margin-bottom: 8px; }
  #p-panel .tabs button { padding: 3px 12px; }
  .p-panel[hidden] { display: none; }
  .p-section { padding: 4px 0 8px; }
  .p-section h3 {
    margin: 0 0 4px; padding-left: 8px; border-left: 3px solid var(--accent);
    font-size: 13px; font-weight: 600;
  }
  .p-section .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 4px 20px; }
  #params .row .field { cursor: help; }
  #params .row .field .name { flex: 0 0 15em; opacity: 1; line-height: 1.25; }
  #params .row .field .name code { display: block; font-size: 11px; opacity: .5; }
  .p-tip {
    position: fixed; z-index: 10; max-width: 380px; padding: 6px 10px; pointer-events: none;
    background: #1c2229; color: var(--text); border: 1px solid var(--accent); border-radius: 4px;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap;
  }
  .p-tip[hidden] { display: none; }
  .pane[hidden] { display: none; }
  .pane { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; }
  #pair { display: flex; flex-wrap: wrap; gap: 8px; }
  #pair figure {
    margin: 0; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: var(--panel); border: 1px solid var(--edge);
  }
  #pair figcaption { font-size: 12px; opacity: .7; }
  #pair img { width: 512px; max-width: 100%; background: #000; display: block; }
  #pair .empty {
    width: 512px; max-width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--edge); opacity: .7; text-align: center; padding: 12px;
  }
  figure {
    margin: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: var(--panel); border: 1px solid var(--edge);
  }
  .screen { position: relative; flex: 1 1 auto; min-height: 0; }
  .screen canvas {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: auto; height: auto; max-width: 100%; max-height: 100%; background: #000;
  }
</style>
</head>
<body>
  <nav class="tabs" aria-label="側">
    <a href="index.html">生成</a>
    <a class="active" aria-current="page">描画</a>
    <a href="separate.html">分離</a>
  </nav>
  <header>
    <h1>Cloud Lab — 雲の細部</h1>
    <div class="tabs" id="subtabs"></div>
    <p id="status"></p>
    <p id="score"></p>
    <p id="error"></p>
  </header>
  <details id="params">
    <summary>パラメーター</summary>
    <div id="p-panel"></div>
    <div class="row" id="p-json"></div>
  </details>
  <div class="pane" id="pane-shot">
    <div class="row" id="cap"><span class="row-title" id="capTitle">cap</span></div>
    <div class="row" id="time"></div>
    <div class="row" id="kind"><span class="row-title">種類</span></div>
    <figure>
      <div class="screen"><canvas id="view"></canvas></div>
    </figure>
  </div>
  <div class="pane" id="pane-compare" hidden>
    <div class="row" id="scenes"><span class="row-title">場面</span></div>
    <div class="row" id="times"><span class="row-title">時刻</span></div>
    <div class="row" id="tiers"><span class="row-title">段</span></div>
    <div class="row" id="kinds"><span class="row-title">種類</span></div>
    <div id="pair">
      <figure>
        <div id="generated-box"><img id="generated" alt=""></div>
        <figcaption id="generated-cap">生成</figcaption>
      </figure>
      <figure>
        <div id="reference-box"><img id="reference" alt=""></div>
        <figcaption id="reference-cap">実写(NASA Worldview)</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
