<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Cloud Lab — 雲の細部</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181d; --edge: #2a3038; --text: #d7dde5; --accent: #ff6a00; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 16px; background: var(--bg); color: var(--text);
    font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; gap: 8px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-width: 0; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  nav a { color: var(--text); opacity: .65; text-decoration: none; font-size: 12px; }
  nav a:hover { opacity: 1; color: var(--accent); }
  p { margin: 0; }
  #status { opacity: .7; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #error { color: #ff8a5c; white-space: pre-wrap; }
  #status:empty, #error:empty { display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .row-title { opacity: .7; margin-right: 4px; }
  .row button {
    background: #1c2229; color: var(--text); border: 1px solid var(--edge);
    border-radius: 4px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .row button:hover { border-color: #3d4650; }
  .row button.active { background: var(--accent); border-color: var(--accent); color: #12151a; font-weight: 600; }
  #pair { display: flex; flex-wrap: wrap; gap: 8px; }
  #pair figure {
    margin: 0; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: var(--panel); border: 1px solid var(--edge);
  }
  #pair figcaption { font-size: 12px; opacity: .7; }
  #pair img { width: 512px; max-width: 100%; background: #000; display: block; }
  #pair .empty {
    width: 512px; max-width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--edge); opacity: .7; text-align: center; padding: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>Cloud Lab — 雲の細部</h1>
    <nav><a href="index.html">雲場の写しへ</a></nav>
    <p id="status"></p>
    <p id="error"></p>
  </header>
  <div class="row" id="scenes"><span class="row-title">場面</span></div>
  <div class="row" id="times"><span class="row-title">時刻</span></div>
  <div class="row" id="tiers"><span class="row-title">段</span></div>
  <div class="row" id="kinds"><span class="row-title">種類</span></div>
  <div id="pair">
    <figure>
      <div id="generated-box"><img id="generated" alt=""></div>
      <figcaption id="generated-cap">生成</figcaption>
    </figure>
    <figure>
      <div id="reference-box"><img id="reference" alt=""></div>
      <figcaption id="reference-cap">実写(NASA Worldview)</figcaption>
    </figure>
  </div>
  <!-- 描画器が占有するキャンバス。撮影は captureTarget へだけ描くので画面には出さない。 -->
  <canvas id="view" style="display:none"></canvas>
</body>
</html>
