<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>敵弾(プラズマ)至近通過音 聴き比べ 6 (重厚・複雑化)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:2em auto;padding:0 1em;background:#111;color:#ddd}
  h1{font-size:1.3em}
  .card{border:1px solid #333;border-radius:8px;padding:1em;margin:1em 0;background:#181818}
  .card h2{margin:0 0 .3em;font-size:1.05em}
  .card p{margin:.3em 0 .8em;color:#aaa;font-size:.85em;line-height:1.5}
  button{background:#2a5;color:#fff;border:0;border-radius:6px;padding:.55em 1.2em;margin-right:.6em;font-size:.95em;cursor:pointer}
  button.burst{background:#36c}
  button:active{filter:brightness(1.3)}
  label{font-size:.85em;color:#bbb;display:block;margin:1.5em 0 .3em}
  input[type=range]{width:320px;vertical-align:middle}
  #volVal{margin-left:.6em}
</style>
</head>
<body>
<h1>敵弾(プラズマ)至近通過音 聴き比べ 6 — 重厚・多様・複雑 / 主音は明確</h1>
<p style="color:#999;font-size:.85em">最終融合の勝ち「追い波も和音(F4)」「+サブ(F5)」を基盤に、層を増やして重厚さ・複雑さを上げた案群。
主音(60→80→42Hz の saw)は全案で最も強く保ち、追加層は控えめの音量にしています。</p>

<label>マスター音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><span id="volVal">0.80</span></label>

<div id="cards"></div>

<h2 style="font-size:1em">採点(1=不採用〜4=採用候補)</h2>
<button id="export" style="background:#555">採点をコピー</button>
<button id="resetScores" style="background:#733">採点リセット</button>
<pre id="scoreOut" style="background:#0a0a0a;border:1px solid #333;padding:.8em;margin-top:1em;font-size:.8em;display:none;white-space:pre-wrap"></pre>

<script>
const ctx = new AudioContext();
const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
document.getElementById('vol').oninput = e => {
  master.gain.value = +e.target.value;
  document.getElementById('volVal').textContent = (+e.target.value).toFixed(2);
};
const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
{ const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
const jit = (v, pct) => v * (1 + (Math.random() * 2 - 1) * pct);
const panOf = () => (Math.random() < 0.5 ? -1 : 1) * jit(0.45, 0.6);

function drone(t, {
  type = 'sawtooth', fLow = 60, fPeak = 80, dur = 0.4, rise = 0.35,
  lpLow = 100, lpHigh = 400, lpQ = 1, vol = 0.15, pan = 0, detune = 0,
} = {}) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(jit(fLow, 0.04) + detune, t);
  o.frequency.exponentialRampToValueAtTime(jit(fPeak, 0.04) + detune, t + dur * rise);
  o.frequency.exponentialRampToValueAtTime(jit(fLow * 0.7, 0.04) + detune, t + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = lpQ;
  f.frequency.setValueAtTime(lpLow, t);
  f.frequency.exponentialRampToValueAtTime(lpHigh, t + dur * 0.3);
  f.frequency.exponentialRampToValueAtTime(lpLow, t + dur * 0.8);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(f).connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function partial(t, freq, dur, vol, pan = 0) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function rumble(t, dur, lpFreq, vol, pan = 0) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lpFreq; f.Q.value = 1.5;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  s.connect(f).connect(g).connect(p).connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

// ---- 基盤: F4+F5 融合 ----
// 本体 saw(主音・最強) + triangle 1.52(和音) + 追い波(本体+和音) + 32Hz サブ
function base(t, {
  ratio = 1.52, chordType = 'triangle', chordVol = 0.09, chordDetune = 3, chordLp = 600,
  wakeDelay = 0.12, wakeVol = 0.1, wakeDur = 0.34,
  pan = null, fLow = 60, fPeak = 80, vol = 0.15, dur = 0.4, sub = 0.1,
  extraVoices = [], rumbleVol = 0, extraPartials = [],
} = {}) {
  if (pan === null) pan = panOf();
  drone(t, { fLow, fPeak, vol, dur, pan });
  drone(t, {
    type: chordType, fLow: fLow * ratio, fPeak: fPeak * ratio,
    lpHigh: chordLp, vol: chordVol, dur, pan, detune: chordDetune,
  });
  for (const ev of extraVoices) {
    drone(t, {
      type: ev.type || 'triangle', fLow: fLow * ev.ratio, fPeak: fPeak * ev.ratio,
      lpHigh: ev.lp || 700, vol: ev.vol, dur, pan: ev.pan !== undefined ? ev.pan : pan,
      detune: ev.detune ?? chordDetune,
    });
  }
  const t2 = t + wakeDelay + Math.random() * 0.04;
  drone(t2, { fLow: 55, fPeak: 70, vol: wakeVol, dur: wakeDur, pan: -pan });
  drone(t2, {
    type: chordType, fLow: 55 * ratio, fPeak: 70 * ratio,
    lpHigh: chordLp, vol: wakeVol * 0.6, dur: wakeDur, pan: -pan, detune: chordDetune,
  });
  if (sub) partial(t, jit(32, 0.1), 0.45, sub);
  if (rumbleVol) rumble(t, dur + 0.2, 120, rumbleVol, pan);
  for (const ep of extraPartials) {
    partial(t, jit(fLow * ep.ratio, 0.05), dur * (ep.durPct || 0.7), ep.vol, ep.pan || 0);
  }
}

// ============ 案 ============

// G1: F4+F5 融合基準(デチューン5度和音+和音付き追い波+サブ)
function g1(t) { base(t); }
// G2: 3声和音 — 1.52 + 2.02(オクターブ上・薄く) で和音の厚み
function g2(t) {
  base(t, { extraVoices: [{ ratio: 2.02, vol: 0.045, lp: 800 }] });
}

// G4: 部分音を散らす — 1.5/2.5/4 倍の薄い部分音で複雑さ(音色の彩)
function g4(t) {
  base(t, {
    extraPartials: [
      { ratio: 2.5, vol: 0.035, durPct: 0.5 },
      { ratio: 3.7, vol: 0.025, durPct: 0.4, pan: -0.3 },
      { ratio: 5.1, vol: 0.018, durPct: 0.3, pan: 0.3 },
    ],
  });
}
// G5: 全体を半音下げて重く(主音 52→70→36Hz)
function g5(t) {
  base(t, { fLow: 52, fPeak: 70, vol: 0.16, sub: 0.12 });
}

// G7: 追い波を2本(三段・間隔縮む) + 各追い波も和音
function g7(t) {
  const pan = panOf();
  drone(t, { pan });
  drone(t, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.09, pan, detune: 3 });
  partial(t, jit(32, 0.1), 0.45, 0.1);
  const t2 = t + 0.1 + Math.random() * 0.03;
  drone(t2, { fLow: 55, fPeak: 70, vol: 0.1, dur: 0.3, pan: -pan });
  drone(t2, { type: 'triangle', fLow: 84, fPeak: 106, lpHigh: 600, vol: 0.06, dur: 0.3, pan: -pan, detune: 3 });
  const t3 = t2 + 0.07 + Math.random() * 0.03;
  drone(t3, { fLow: 50, fPeak: 62, vol: 0.06, dur: 0.26, pan });
  drone(t3, { type: 'triangle', fLow: 76, fPeak: 94, lpHigh: 600, vol: 0.035, dur: 0.26, pan, detune: 3 });
}
// G8: 発音ごとの多様性 — 和音比・追い波遅延・部分音を毎回ランダム
function g8(t) {
  const ratio = 1.5 + Math.random() * 0.08;         // 1.50〜1.58
  const wakeDelay = 0.1 + Math.random() * 0.06;      // 100〜160ms
  const nPart = 1 + Math.floor(Math.random() * 3);   // 1〜3本
  const partials = [];
  for (let i = 0; i < nPart; i++) {
    partials.push({
      ratio: 2 + Math.random() * 3.5,
      vol: 0.02 + Math.random() * 0.02,
      durPct: 0.3 + Math.random() * 0.4,
      pan: (Math.random() * 2 - 1) * 0.5,
    });
  }
  base(t, { ratio, wakeDelay, extraPartials: partials });
}
// G9: 全入り重厚版 — 3声+ランブル+部分音+サブ強め
function g9(t) {
  base(t, {
    extraVoices: [{ ratio: 2.02, vol: 0.04, lp: 800 }],
    rumbleVol: 0.05, sub: 0.12,
    extraPartials: [
      { ratio: 2.5, vol: 0.03, durPct: 0.5 },
      { ratio: 3.7, vol: 0.02, durPct: 0.4, pan: -0.3 },
    ],
  });
}


const variants = [
  { id: 'G1', name: 'F4+F5 基準', fn: g1, desc: 'デチューン5度+和音付き追い波+サブ。' },
  { id: 'G2', name: '3声和音', fn: g2, desc: '+2.02倍の薄い3声目。和音の厚み。' },
  { id: 'G4', name: '部分音の彩', fn: g4, desc: '2.5/3.7/5.1倍の薄い部分音。複雑さ。' },
  { id: 'G5', name: '半音下げ', fn: g5, desc: '主音52→70Hz。全体を重く。' },
  { id: 'G7', name: '三段和音ヴン', fn: g7, desc: '追い波2本、各和音付き。動作の複雑さ。' },
  { id: 'G8', name: '毎回ランダム', fn: g8, desc: '和音比・遅延・部分音が発音ごとに変化。' },
  { id: 'G9', name: '全入り重厚', fn: g9, desc: '3声+ランブル+部分音+強サブ。上限確認。' },
];

const cards = document.getElementById('cards');
const timers = new Map();
for (const v of variants) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${v.id}. ${v.name}</h2><p>${v.desc}</p>`;
  const b1 = document.createElement('button'); b1.textContent = '1回';
  b1.onclick = () => { ctx.resume(); v.fn(ctx.currentTime + 0.05); };
  const b2 = document.createElement('button'); b2.textContent = '連続(押し続け)';
  b2.className = 'burst';
  const start = () => {
    ctx.resume();
    v.fn(ctx.currentTime + 0.05);
    timers.set(v.id, setInterval(() => { v.fn(ctx.currentTime + 0.01); }, 550));
  };
  const stop = () => { clearInterval(timers.get(v.id)); timers.delete(v.id); };
  b2.onpointerdown = start; b2.onpointerup = b2.onpointerleave = stop;
  card.append(b1, b2);
  const row = document.createElement('div');
  row.style.marginTop = '.6em';
  row.append('採点: ');
  const btns = [];
  const paint = () => {
    const r = JSON.parse(localStorage.getItem('plasma-ratings6') || '{}');
    btns.forEach((b, i) => { b.style.background = r[v.id] === i + 1 ? '#c93' : '#333'; });
  };
  for (let n = 1; n <= 4; n++) {
    const b = document.createElement('button');
    b.textContent = n; b.style.padding = '.3em .8em'; b.style.marginRight = '.4em';
    b.onclick = () => {
      const r = JSON.parse(localStorage.getItem('plasma-ratings6') || '{}');
      if (r[v.id] === n) delete r[v.id]; else r[v.id] = n;
      localStorage.setItem('plasma-ratings6', JSON.stringify(r));
      paint();
    };
    btns.push(b); row.append(b);
  }
  paint();
  card.append(row);
  cards.append(card);
}
document.getElementById('export').onclick = async () => {
  const ratings = JSON.parse(localStorage.getItem('plasma-ratings6') || '{}');
  const lines = variants
    .map(v => `${v.id} ${v.name}: ${ratings[v.id] ?? '未採点'}`)
    .sort((a, b) => (parseInt(b.match(/: (\d)/)?.[1] || '0')) - (parseInt(a.match(/: (\d)/)?.[1] || '0')));
  const text = '敵弾6(重厚・複雑化) 採点(4段階)\n' + lines.join('\n');
  const out = document.getElementById('scoreOut');
  out.textContent = text; out.style.display = 'block';
  try { await navigator.clipboard.writeText(text); out.textContent += '\n\n(クリップボードへコピー済み)'; } catch {}
};
document.getElementById('resetScores').onclick = () => {
  localStorage.removeItem('plasma-ratings6');
  location.reload();
};
</script>
</body>
</html>
