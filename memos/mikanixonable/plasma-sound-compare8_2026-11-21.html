<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>敵弾(プラズマ)至近通過音 聴き比べ 8 (音数・タイミング・音色)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:2em auto;padding:0 1em;background:#111;color:#ddd}
  h1{font-size:1.3em}
  .card{border:1px solid #333;border-radius:8px;padding:1em;margin:1em 0;background:#181818}
  .card h2{margin:0 0 .3em;font-size:1.05em}
  .card p{margin:.3em 0 .8em;color:#aaa;font-size:.85em;line-height:1.5}
  button{background:#2a5;color:#fff;border:0;border-radius:6px;padding:.55em 1.2em;margin-right:.6em;font-size:.95em;cursor:pointer}
  button.burst{background:#36c}
  button:active{filter:brightness(1.3)}
  label{font-size:.85em;color:#bbb;display:block;margin:1.5em 0 .3em}
  input[type=range]{width:320px;vertical-align:middle}
  #volVal{margin-left:.6em}
</style>
</head>
<body>
<h1>敵弾(プラズマ)至近通過音 聴き比べ 8 — 音数・タイミング・音色</h1>
<p style="color:#999;font-size:.85em">これまで全案で固定だった「3発構成・同時発音・saw+triangle 固定・0.4s」を崩す探索。
テーマは <b>プラズマ(荷電粒子の束)</b>・<b>干渉(波の重なり)</b>・<b>宇宙(遅く大きいスケール)</b>。
音数(1〜7声)・発音タイミング・波形を大きく変えています。主音の「ヴン」はどの案にも残しています。</p>

<label>マスター音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><span id="volVal">0.80</span></label>

<div id="cards"></div>

<h2 style="font-size:1em">採点(1=不採用〜4=採用候補)</h2>
<button id="export" style="background:#555">採点をコピー</button>
<button id="resetScores" style="background:#733">採点リセット</button>
<pre id="scoreOut" style="background:#0a0a0a;border:1px solid #333;padding:.8em;margin-top:1em;font-size:.8em;display:none;white-space:pre-wrap"></pre>

<script>
const ctx = new AudioContext();
const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
document.getElementById('vol').oninput = e => {
  master.gain.value = +e.target.value;
  document.getElementById('volVal').textContent = (+e.target.value).toFixed(2);
};
const jit = (v, pct) => v * (1 + (Math.random() * 2 - 1) * pct);
const panOf = () => (Math.random() < 0.5 ? -1 : 1) * jit(0.45, 0.6);

function drone(t, {
  type = 'sawtooth', fLow = 60, fPeak = 80, dur = 0.4, rise = 0.35,
  lpLow = 100, lpHigh = 400, lpQ = 1, vol = 0.15, pan = 0, detune = 0,
} = {}) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(jit(fLow, 0.04) + detune, t);
  o.frequency.exponentialRampToValueAtTime(jit(fPeak, 0.04) + detune, t + dur * rise);
  o.frequency.exponentialRampToValueAtTime(jit(fLow * 0.7, 0.04) + detune, t + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = lpQ;
  f.frequency.setValueAtTime(lpLow, t);
  f.frequency.exponentialRampToValueAtTime(lpHigh, t + dur * 0.3);
  f.frequency.exponentialRampToValueAtTime(lpLow, t + dur * 0.8);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(f).connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function partial(t, freq, dur, vol, pan = 0) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

// ゲート付きドローン(パルス化)
function droneGated(t, { rate = 22, dur = 0.4, vol = 0.15, pan = 0 } = {}) {
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(jit(60, 0.04), t);
  o.frequency.exponentialRampToValueAtTime(jit(80, 0.04), t + dur * 0.35);
  o.frequency.exponentialRampToValueAtTime(jit(42, 0.04), t + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(100, t);
  f.frequency.exponentialRampToValueAtTime(400, t + dur * 0.3);
  f.frequency.exponentialRampToValueAtTime(100, t + dur * 0.8);
  const gate = ctx.createGain(); gate.gain.value = 0;
  const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = jit(rate, 0.25);
  const lg = ctx.createGain(); lg.gain.value = vol * 0.5;
  const dc = ctx.createConstantSource(); dc.offset.value = vol * 0.5;
  lfo.connect(lg).connect(gate.gain); dc.connect(gate.gain);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(1, t + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  o.connect(f).connect(gate).connect(g).connect(p).connect(master);
  [o, lfo, dc].forEach(x => { x.start(t); x.stop(t + dur + 0.05); });
}

// ============ 案 ============

// K1: 1声だけ — 主音ソロ(音数の下限・対照)
function k1(t) { drone(t, { pan: panOf() }); }

// K3: 時間差の到達 — 4声が 0/60/120/180ms にずれて入る(波面が届く)
function k3(t) {
  const pan = panOf();
  drone(t, { vol: 0.14, pan });
  drone(t + 0.06, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.08, pan, detune: 3 });
  drone(t + 0.12, { type: 'triangle', fLow: 55, fPeak: 70, vol: 0.09, dur: 0.3, pan: -pan });
  drone(t + 0.18, { type: 'sine', fLow: 30, fPeak: 38, vol: 0.1, dur: 0.35, lpHigh: 80 });
}
// K4: フィラメント束 — 小さい「ヴン」5発を間隔不規則に(プラズマの筋)
function k4(t) {
  const pan = panOf();
  drone(t, { vol: 0.13, pan });
  let tt = t + 0.05;
  for (let i = 0; i < 5; i++) {
    tt += 0.04 + Math.random() * 0.06;
    drone(tt, {
      type: Math.random() < 0.5 ? 'triangle' : 'sawtooth',
      fLow: 55 + Math.random() * 40, fPeak: 70 + Math.random() * 50,
      vol: 0.05 + Math.random() * 0.04, dur: 0.18 + Math.random() * 0.1,
      pan: (Math.random() * 2 - 1) * 0.7,
    });
  }
}
// K5: 干渉ビート — 60Hz と 63Hz がゆっくり唸り合う(主題ど真ん中)
function k5(t) {
  const pan = panOf();
  drone(t, { vol: 0.13, pan });
  drone(t, { vol: 0.13, pan: -pan, detune: 0, fLow: 63, fPeak: 84 });
  drone(t, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.06, pan, detune: 3 });
  drone(t + 0.12, { fLow: 55, fPeak: 70, vol: 0.09, dur: 0.32, pan: -pan });
}
// K6: パルス化プラズマ — 主音を22Hzでゲート(断続する荷電粒子)
function k6(t) {
  const pan = panOf();
  droneGated(t, { rate: 22, pan });
  drone(t, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.06, pan, detune: 3 });
  drone(t + 0.12, { fLow: 55, fPeak: 70, vol: 0.09, dur: 0.32, pan: -pan });
}
// K7: 全声 sine/triangle — 角のない宇宙(音色を全部丸く)
function k7(t) {
  const pan = panOf();
  drone(t, { type: 'triangle', vol: 0.16, pan });
  drone(t, { type: 'sine', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.1, pan });
  drone(t + 0.12, { type: 'triangle', fLow: 55, fPeak: 70, vol: 0.1, dur: 0.34, pan: -pan });
  partial(t, jit(32, 0.1), 0.45, 0.12);
}
// K8: 主音 square — 空洞のある音色(square 基調の対照)
function k8(t) {
  const pan = panOf();
  drone(t, { type: 'square', vol: 0.12, lpHigh: 300, pan });
  drone(t, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.07, pan, detune: 3 });
  drone(t + 0.12, { type: 'square', fLow: 55, fPeak: 70, lpHigh: 250, vol: 0.07, dur: 0.34, pan: -pan });
  partial(t, jit(32, 0.1), 0.45, 0.1);
}
// K9: 宇宙スケール — 全部 2 倍長くゆっくり(0.8s)
function k9(t) {
  const pan = panOf();
  drone(t, { vol: 0.15, dur: 0.8, pan });
  drone(t, { type: 'triangle', fLow: 91, fPeak: 122, lpHigh: 600, vol: 0.08, dur: 0.8, pan, detune: 3 });
  drone(t + 0.2, { fLow: 55, fPeak: 70, vol: 0.09, dur: 0.55, pan: -pan });
  partial(t, jit(32, 0.1), 0.8, 0.11);
}

// K12: 毎回声数が変わる — 2〜5声ランダム(多様性の上限)
function k12(t) {
  const pan = panOf();
  const n = 2 + Math.floor(Math.random() * 4);
  drone(t, { vol: 0.14, pan });
  const pool = [1.52, 2.02, 0.5, 2.5, 1.2];
  for (let i = 0; i < n - 1; i++) {
    const r = pool[Math.floor(Math.random() * pool.length)];
    drone(t + Math.random() * 0.08, {
      type: Math.random() < 0.6 ? 'triangle' : 'sawtooth',
      fLow: 60 * r, fPeak: 80 * r,
      lpHigh: 400 + r * 100, vol: 0.05 + Math.random() * 0.04,
      pan: (Math.random() * 2 - 1) * 0.7, detune: Math.random() * 5,
    });
  }
  drone(t + 0.1 + Math.random() * 0.05, { fLow: 55, fPeak: 70, vol: 0.09, dur: 0.32, pan: -pan });
}

const variants = [
  { id: 'K1', name: '1声ソロ', fn: k1, desc: '主音だけ。音数の下限対照。' },
  { id: 'K3', name: '時間差の到達', fn: k3, desc: '4声が60ms刻みで到達。波面が届く感じ。' },
  { id: 'K4', name: 'フィラメント束', fn: k4, desc: '小さいヴン5発を不規則に。プラズマの筋。' },
  { id: 'K5', name: '干渉ビート', fn: k5, desc: '60Hzと63Hzが唸り合う。' },
  { id: 'K6', name: 'パルス化', fn: k6, desc: '主音を22Hzで断続。荷電粒子のパルス。' },
  { id: 'K7', name: '全声 sine/triangle', fn: k7, desc: '角のない丸い宇宙。' },
  { id: 'K8', name: '主音 square', fn: k8, desc: '空洞のある音色。' },
  { id: 'K9', name: '宇宙スケール', fn: k9, desc: '全部2倍長い0.8s。' },
  { id: 'K12', name: '毎回2〜5声', fn: k12, desc: '声数自体がランダム。' },
];

const cards = document.getElementById('cards');
const timers = new Map();
for (const v of variants) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${v.id}. ${v.name}</h2><p>${v.desc}</p>`;
  const b1 = document.createElement('button'); b1.textContent = '1回';
  b1.onclick = () => { ctx.resume(); v.fn(ctx.currentTime + 0.05); };
  const b2 = document.createElement('button'); b2.textContent = '連続(押し続け)';
  b2.className = 'burst';
  const start = () => {
    ctx.resume();
    v.fn(ctx.currentTime + 0.05);
    timers.set(v.id, setInterval(() => { v.fn(ctx.currentTime + 0.01); }, 900));
  };
  const stop = () => { clearInterval(timers.get(v.id)); timers.delete(v.id); };
  b2.onpointerdown = start; b2.onpointerup = b2.onpointerleave = stop;
  card.append(b1, b2);
  const row = document.createElement('div');
  row.style.marginTop = '.6em';
  row.append('採点: ');
  const btns = [];
  const paint = () => {
    const r = JSON.parse(localStorage.getItem('plasma-ratings8') || '{}');
    btns.forEach((b, i) => { b.style.background = r[v.id] === i + 1 ? '#c93' : '#333'; });
  };
  for (let n = 1; n <= 4; n++) {
    const b = document.createElement('button');
    b.textContent = n; b.style.padding = '.3em .8em'; b.style.marginRight = '.4em';
    b.onclick = () => {
      const r = JSON.parse(localStorage.getItem('plasma-ratings8') || '{}');
      if (r[v.id] === n) delete r[v.id]; else r[v.id] = n;
      localStorage.setItem('plasma-ratings8', JSON.stringify(r));
      paint();
    };
    btns.push(b); row.append(b);
  }
  paint();
  card.append(row);
  cards.append(card);
}
document.getElementById('export').onclick = async () => {
  const ratings = JSON.parse(localStorage.getItem('plasma-ratings8') || '{}');
  const lines = variants
    .map(v => `${v.id} ${v.name}: ${ratings[v.id] ?? '未採点'}`)
    .sort((a, b) => (parseInt(b.match(/: (\d)/)?.[1] || '0')) - (parseInt(a.match(/: (\d)/)?.[1] || '0')));
  const text = '敵弾8(音数・タイミング・音色) 採点(4段階)\n' + lines.join('\n');
  const out = document.getElementById('scoreOut');
  out.textContent = text; out.style.display = 'block';
  try { await navigator.clipboard.writeText(text); out.textContent += '\n\n(クリップボードへコピー済み)'; } catch {}
};
document.getElementById('resetScores').onclick = () => {
  localStorage.removeItem('plasma-ratings8');
  location.reload();
};
</script>
</body>
</html>
