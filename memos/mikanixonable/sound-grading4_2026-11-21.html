const ctx = new AudioContext();
const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
{ const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
function tone(freq, dur, vol, type, when = 0) {
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
// 音高が a→b へ滑る音
function sweep(a, b, dur, vol, type, when = 0) {
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(a, t); o.frequency.exponentialRampToValueAtTime(b, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, type, freq, vol, when = 0, q = 1) {
  const t = ctx.currentTime + when;
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * 0.5, dur + 0.02); s.stop(t + dur + 0.05);
}
// 自機被弾(proximity 0..1)
function hitSound(p, wave, fMul, gMul) {
  const t = ctx.currentTime;
  const freq = (80 + 90 * p) * fMul, peak = (0.2 + 0.7 * p) * gMul, tail = (0.02 + 0.08 * p) * gMul;
  const o = ctx.createOscillator(); o.type = wave; o.frequency.setValueAtTime(freq, t);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(70, t); f.frequency.exponentialRampToValueAtTime(190, t + 0.1);
  f.frequency.exponentialRampToValueAtTime(55, t + 0.32);
  const g = ctx.createGain(); g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(tail, t + 0.35);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.38);
}
function chord(freqs, dur, vol, wave, slideTo = 0.72) {
  const t = ctx.currentTime;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(520, t + 0.08);
  f.frequency.exponentialRampToValueAtTime(130, t + dur * 0.9);
  const g = ctx.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  freqs.forEach(fr => {
    const o = ctx.createOscillator(); o.type = wave;
    o.frequency.setValueAtTime(fr, t); o.frequency.exponentialRampToValueAtTime(fr * slideTo, t + dur * 0.8);
    o.connect(f); o.start(t); o.stop(t + dur);
  });
  f.connect(g).connect(master);
}
function boom(noiseLo, kickA, kickB, kickDur, tail) {
  noiseBurst(tail, 'lowpass', noiseLo, 0.8);
  noiseBurst(tail * 0.5, 'lowpass', noiseLo * 2.6, 0.5);
  sweep(kickA, kickB, kickDur, 0.8, 'sine');
}
function klaxonBuf() {
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = buf.getChannelData(0);
  const beep = (a, b, fr) => {
    const i0 = Math.floor(a * ctx.sampleRate), i1 = Math.floor(b * ctx.sampleRate);
    const fade = Math.floor(ctx.sampleRate * 0.004);
    for (let i = i0; i < i1; i++) {
      const sq = (i * fr * 2 / ctx.sampleRate) % 2 < 1 ? 1 : -1;
      d[i] = sq * Math.min(1, (i - i0) / fade, (i1 - i) / fade);
    }
  };
  beep(0, 0.18, 880); beep(0.3, 0.48, 587);
  return buf;
}
function loopChannel(freq, q, buffer, lfoHz, lfoDepth) {
  const s = ctx.createBufferSource(); s.buffer = buffer || noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.value = 0;
  if (buffer) s.connect(g); else s.connect(f).connect(g);
  if (lfoHz) {
    const lfo = ctx.createOscillator(); lfo.frequency.value = lfoHz;
    const lg = ctx.createGain(); lg.gain.value = lfoDepth;
    lfo.connect(lg).connect(g.gain); lfo.start();
  }
  g.connect(master); s.start();
  return g;
}
function klaxonBuf2() {
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = buf.getChannelData(0);
  const beep = (a, b, fr) => {
    const i0 = Math.floor(a * ctx.sampleRate), i1 = Math.floor(b * ctx.sampleRate);
    const fade = Math.floor(ctx.sampleRate * 0.004);
    for (let i = i0; i < i1; i++) {
      const sq = (i * fr * 2 / ctx.sampleRate) % 2 < 1 ? 1 : -1;
      d[i] = sq * Math.min(1, (i - i0) / fade, (i1 - i) / fade);
    }
  };
  beep(0, 0.14, 880); beep(0.22, 0.36, 880); beep(0.44, 0.58, 660);
  return buf;
}
// 2層のバンドパスノイズを1つの音量ノードへ混ぜる。
function dualLoop(f1, q1, f2, q2) {
  const g = ctx.createGain(); g.gain.value = 0;
  [[f1, q1], [f2, q2]].forEach(([fr, q]) => {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = q;
    src.connect(f).connect(g); src.start();
  });
  g.connect(master);
  return g;
}
function klaxonLoop(lp) {
  const s = ctx.createBufferSource(); s.buffer = klaxonBuf(); s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
  const g = ctx.createGain(); g.gain.value = 0;
  s.connect(f).connect(g).connect(master); s.start();
  return g;
}
function klaxonLoopR(lp, rate) {
  const s = ctx.createBufferSource(); s.buffer = klaxonBuf(); s.loop = true;
  s.playbackRate.value = rate;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
  const g = ctx.createGain(); g.gain.value = 0;
  s.connect(f).connect(g).connect(master); s.start();
  return g;
}
function klaxon2Loop(lp) {
  const s = ctx.createBufferSource(); s.buffer = klaxonBuf2(); s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
  const g = ctx.createGain(); g.gain.value = 0;
  s.connect(f).connect(g).connect(master); s.start();
  return g;
}
const LOOPS = {

  'alarm-a': { make: () => loopChannel(0, 0, klaxonBuf()), gain: 0.06 },

    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;

  // 採用案ベースの別案

const live = {};
function toggleLoop(name, btn) {
  if (live[name]) {
    live[name].gain.setTargetAtTime(0, ctx.currentTime, 0.05);
    live[name] = null; if (btn) btn.classList.remove('playing');
  } else {
    const ch = LOOPS[name].make();
    ch.gain.setTargetAtTime(LOOPS[name].gain, ctx.currentTime, 0.05);
    live[name] = ch; if (btn) btn.classList.add('playing');
  }
}

const KEY = location.pathname + '#scores';
let scores = {};
try { scores = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const cardsEl = document.getElementById('cards');
for (const it of ITEMS) {
  const sec = document.createElement('section'); sec.className = 'snd';
  sec.innerHTML = '<h2>' + it.name + '</h2><p class="snd-desc">' + it.desc + '</p><div class="vars"></div>';
  const vars = sec.querySelector('.vars');
  it.variants.forEach((v, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<div class="vname">' + v.label + '</div><p>' + v.desc + '</p>' +
      '<div class="row"><button class="play">' + PLAY_LABEL + '</button></div>' +
      '<div class="score"></div>';
    const sid = it.id + '.' + i;
    card.querySelector('.play').onclick = (e) => v.play(e.currentTarget);
    const ad = document.createElement('label'); ad.className = 'adopt';
    const r = document.createElement('input'); r.type = 'radio'; r.name = 'adopt-' + it.id;
    if (scores[it.id + '.adopt'] === i) r.checked = true;
    ad.appendChild(r); ad.appendChild(document.createTextNode('採用'));
    r.onchange = () => { scores[it.id + '.adopt'] = i; localStorage.setItem(KEY, JSON.stringify(scores)); };
    card.appendChild(ad);
    const sc = card.querySelector('.score');
    for (let n = 1; n <= 4; n++) {
      const b = document.createElement('button'); b.textContent = n; b.dataset.v = n;
      if (scores[sid] === n) b.classList.add('on');
      b.onclick = () => {
        scores[sid] = n;
        sc.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.v === n));
        localStorage.setItem(KEY, JSON.stringify(scores));
      };
      sc.appendChild(b);
    }
    vars.appendChild(card);
  });
  cardsEl.appendChild(sec);
}
document.getElementById('vol').oninput = e => {
  master.gain.value = +e.target.value;
  document.getElementById('volVal').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('export').onclick = () => {
  const lines = [];
  for (const it of ITEMS) it.variants.forEach((v, i) => {
    lines.push(it.id + ' ' + v.label + ': ' + (scores[it.id + '.' + i] ?? '-') + (scores[it.id + '.adopt'] === i ? ' [採用]' : ''));
  });
  const out = document.getElementById('scoreOut');
  out.textContent = lines.join('\n'); out.style.display = 'block';
  navigator.clipboard?.writeText(lines.join('\n'));
};
document.getElementById('resetScores').onclick = () => {
  scores = {}; localStorage.removeItem(KEY);
  document.querySelectorAll('.score button').forEach(b => b.classList.remove('on'));
};

// カテゴリ見出しを各セクションの前へ挿入する(ITEMS は宣言順)。
(() => {
  const counts = [7,3,7];
  const heads = [...document.querySelectorAll('#cards .snd')];
  let cursor = 0;
  counts.forEach((count, ci) => {
    const h = document.createElement('div'); h.className = 'cathead';
    h.innerHTML = CATS_META[ci].title + '<small>' + CATS_META[ci].sub + '</small>';
    cardsEl.insertBefore(h, heads[cursor]);
    cursor += count;
  });
})();
</script>
</body>
