<html lang="ja">
<head>
<meta charset="utf-8">

<title>git branch history — workspace3</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --surface: #11182b;
  --surface-raised: #17213a;
  --surface-soft: #0f1628;
  --border: #2a3653;
  --border-strong: #3a4a6e;
  --text: #edf2ff;
  --muted: #9ba9c8;
  --faint: #657393;
  --accent: #89b4ff;
  --accent-soft: rgba(137, 180, 255, .14);
  --danger: #ff9a9a;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
}
button, input { font: inherit; }
button { color: inherit; }
.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 16px 24px;
  background: rgba(11, 16, 32, .94);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}
.title-block { min-width: 240px; }
.eyebrow {
  color: var(--accent);
  font: 600 11px/1 var(--font-mono);
  letter-spacing: .13em;
  text-transform: uppercase;
}
h1 {
  margin: 6px 0 0;
  font-size: 19px;
  line-height: 1.2;
  font-weight: 700;
}
.current-branch { color: var(--muted); font: 12px var(--font-mono); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-left: auto; }
.stat { display: grid; gap: 3px; }
.stat-label { color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.stat-value { font: 600 14px var(--font-mono); }
.workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
}
.sidebar {
  min-height: 0;
  overflow: auto;
  padding: 20px 14px 28px 20px;
  border-right: 1px solid var(--border);
  background: var(--surface-soft);
}
.sidebar-section + .sidebar-section { margin-top: 24px; }
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0 6px 9px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.section-count { color: var(--faint); font: 11px var(--font-mono); }
.search-wrap { position: relative; margin-bottom: 10px; }
.search-wrap input {
  width: 100%;
  padding: 9px 11px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-meta { min-height: 17px; margin: 5px 6px 0; color: var(--faint); font: 11px var(--font-mono); }
.ref-list { display: grid; gap: 3px; }
.ref-entry {
  display: grid;
  grid-template-columns: 9px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 7px;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
}
.ref-entry:hover { background: var(--surface); border-color: var(--border); }
.ref-entry[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(137, 180, 255, .35); }
.ref-swatch { width: 8px; height: 8px; border-radius: 50%; }
.ref-name { overflow: hidden; color: var(--text); font: 12px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
.ref-kind { color: var(--faint); font-size: 10px; }
.legend { display: grid; gap: 10px; color: var(--muted); font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 9px; }
.legend-node { width: 10px; height: 10px; border: 2px solid var(--accent); border-radius: 50%; }
.legend-merge { width: 10px; height: 10px; border: 2px solid #d7a7ff; transform: rotate(45deg); }
.legend-line { width: 21px; height: 2px; background: #78d4c1; }
.legend-group { min-width: 27px; padding: 2px 3px; color: var(--accent); border: 1px solid var(--border-strong); border-radius: 4px; font: 600 10px var(--font-mono); text-align: center; }
.main {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 57px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.toolbar-note { color: var(--muted); font-size: 12px; }
.toolbar-note code { color: var(--accent); font-family: var(--font-mono); }
.toolbar-spacer { flex: 1; }
.toolbar-button {
  padding: 7px 10px;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
}
.toolbar-button:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-raised); }
.graph-scroll {
  min-height: 0;
  overflow: auto;
  background:
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 52px 100%,
    var(--bg);
}
#graph { display: block; min-width: 100%; }
.graph-label {
  fill: var(--muted);
  font-family: var(--font-sans);
  font-size: 12px;
}
.graph-sha {
  fill: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
}
.graph-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.15; opacity: .72; }
.graph-path.merge { stroke-dasharray: 4 3; opacity: .9; }
.graph-node { cursor: pointer; transition: opacity .12s ease; }
.graph-node .node-halo { fill: var(--bg); stroke-width: 2.4; }
.graph-node .node-core { stroke: var(--bg); stroke-width: 1.5; }
.graph-node.merge .node-halo { transform-box: fill-box; transform-origin: center; transform: rotate(45deg); rx: 2px; }
.graph-node.group .node-halo { fill: var(--surface-raised); stroke-width: 1.8; }
.graph-node.group .group-count { fill: var(--text); font: 600 10px var(--font-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.graph-node.group:hover .node-halo, .graph-node.group.selected .node-halo { stroke: #fff; stroke-width: 2.5; }
.graph-node:hover .node-halo, .graph-node.selected .node-halo { stroke: #fff; stroke-width: 3; }
.graph-node.search-match .node-halo { stroke: var(--danger); stroke-width: 3; }
.graph-node.dim, .graph-path.dim { opacity: .08; }
.graph-node.dim.search-match { opacity: 1; }
.commit-detail {
  min-height: 112px;
  padding: 14px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.detail-empty { color: var(--faint); font-size: 12px; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 24px; align-items: start; }
.detail-subject { grid-column: 1 / -1; font-size: 14px; font-weight: 650; }
.detail-meta { color: var(--muted); font: 11px/1.6 var(--font-mono); }
.detail-meta code { color: var(--accent); }
.detail-refs { color: #c7a2ff; font: 11px/1.6 var(--font-mono); text-align: right; }
.detail-parents { grid-column: 1 / -1; color: var(--faint); font: 11px var(--font-mono); }
@media (max-width: 850px) {
  .topbar { align-items: flex-start; flex-wrap: wrap; gap: 12px 18px; }
  .stats { width: 100%; margin-left: 0; }
  .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .sidebar { max-height: 310px; border-right: 0; border-bottom: 1px solid var(--border); }
  .ref-list { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
</style>
</head>

<div class="app" id="app">

      <div class="eyebrow">git history / branch network</div>

    <main class="main">

        <div class="toolbar-spacer"></div>
        <button class="toolbar-button" type="button" id="fit-latest">最新へ移動</button>
        <button class="toolbar-button" type="button" id="fit-selected">選択位置へ</button>
      </div>
      <div class="graph-scroll" id="graph-scroll" tabindex="0" aria-label="gitブランチ履歴グラフ">
        <svg id="graph" role="img" aria-labelledby="graph-title graph-desc">
          <title id="graph-title">git branch history graph</title>
          <desc id="graph-desc">コミットを縦方向、親コミットへの関係を色付きの路線として表示する。</desc>
          <g id="graph-paths"></g>
          <g id="graph-nodes"></g>
          <g id="graph-labels"></g>
        </svg>
      </div>
      <section class="commit-detail" id="commit-detail" aria-live="polite">
        <div class="detail-empty">コミットを選択すると、メッセージ・作者・親コミット・参照名を表示します。</div>
      </section>
    </main>
  </div>
</div>

const COLORS = ['#78d4c1', '#89b4ff', '#d7a7ff', '#ffbd7a', '#f28ca8', '#b6d77b', '#ffdf82', '#83c9ff'];
const NS = 'http://www.w3.org/2000/svg';
const ROW_HEIGHT = 30;
const LANE_WIDTH = 22;
const GRAPH_LEFT = 26;
const LABEL_LEFT = 142;
const graph = document.getElementById('graph');
const graphScroll = document.getElementById('graph-scroll');
const pathLayer = document.getElementById('graph-paths');
const nodeLayer = document.getElementById('graph-nodes');

const commitNodes = new Map();
const displayNodeByCommit = new Map();
const commitPaths = [];
const refsByCommit = new Map();
let compressedGraph = null;

for (const ref of SNAPSHOT.refs) {
  const list = refsByCommit.get(ref.tip) || [];
  list.push(ref);
  refsByCommit.set(ref.tip, list);
}

function element(name, attributes = {}) {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
  return node;
}

function escapeText(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
}

function formatDate(timestamp) {
  return new Intl.DateTimeFormat('ja-JP', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(timestamp * 1000));
}

function shortSubject(subject, maxLength = 84) {
  return subject.length > maxLength ? subject.slice(0, maxLength - 1) + '…' : subject;
}

function laneColor(lane) {
  return COLORS[lane % COLORS.length];
}

function branchColor(index) {
  return COLORS[(index * 3 + 1) % COLORS.length];
}

function pathFor(x1, y1, x2, y2) {
  const bend = Math.min(11, (y2 - y1) * .35);
  if (x1 === x2) return 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2;
  return 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + bend) + ' ' + x2 + ' ' + (y2 - bend) + ' ' + x2 + ' ' + y2;
}

function buildCompressedGraph() {
  const children = SNAPSHOT.commits.map(() => []);
  const referencedTips = new Set(SNAPSHOT.refs.map((ref) => ref.tip));
  for (let index = 0; index < SNAPSHOT.commits.length; index += 1) {
    for (const parent of SNAPSHOT.commits[index][1]) children[parent].push(index);
  }

  const important = SNAPSHOT.commits.map((commit, index) => (
    referencedTips.has(index) || commit[1].length !== 1 || children[index].length !== 1
  ));
  const nodeForCommit = new Array(SNAPSHOT.commits.length);
  const nodes = [];

  for (let index = 0; index < SNAPSHOT.commits.length; index += 1) {
    if (nodeForCommit[index] !== undefined) continue;
    if (important[index]) {
      const nodeIndex = nodes.length;
      nodes.push({ kind: 'commit', representative: index, members: [index], parentActuals: SNAPSHOT.commits[index][1] });
      nodeForCommit[index] = nodeIndex;
      continue;
    }

    const members = [];
    let cursor = index;
    while (cursor !== undefined && nodeForCommit[cursor] === undefined && !important[cursor]) {
      members.push(cursor);
      const parent = SNAPSHOT.commits[cursor][1][0];
      cursor = parent === undefined || important[parent] ? undefined : parent;
    }

    const nodeIndex = nodes.length;
    if (members.length === 1) {
      nodes.push({ kind: 'commit', representative: members[0], members, parentActuals: SNAPSHOT.commits[members[0]][1] });
    } else {
      nodes.push({ kind: 'group', representative: members[0], members, parentActuals: SNAPSHOT.commits[members[members.length - 1]][1] });
    }
    for (const member of members) nodeForCommit[member] = nodeIndex;
  }

  for (const node of nodes) {
    node.parents = [...new Set(node.parentActuals.map((parent) => nodeForCommit[parent]).filter((parent) => parent !== undefined))];
    for (const member of node.members) displayNodeByCommit.set(member, nodes.indexOf(node));
  }
  return { nodes, nodeForCommit };
}

function computeLayout() {
  compressedGraph = buildCompressedGraph();
  const lanes = [];
  const segments = [];
  const rows = [];
  for (let index = 0; index < compressedGraph.nodes.length; index += 1) {
    const displayNode = compressedGraph.nodes[index];
    let commitLane = lanes.indexOf(index);
    if (commitLane < 0) {
      commitLane = lanes.length;
      lanes.push(index);
    }
    const before = lanes.slice();
    const next = lanes.slice();
    next.splice(commitLane, 1, ...displayNode.parents);
    const uniqueNext = [];
    const seen = new Set();
    for (const token of next) {
      if (!seen.has(token)) {
        uniqueNext.push(token);
        seen.add(token);
      }
    }
    for (let lane = 0; lane < before.length; lane += 1) {
      const token = before[lane];
      if (token === index) {
        for (let parentIndex = 0; parentIndex < displayNode.parents.length; parentIndex += 1) {
          const parent = displayNode.parents[parentIndex];
          const targetLane = uniqueNext.indexOf(parent);
          if (targetLane >= 0) segments.push({ row: index, token: index, from: commitLane, to: targetLane, lane: commitLane, merge: parentIndex > 0 });
        }
      } else {
        const targetLane = uniqueNext.indexOf(token);
        if (targetLane >= 0) segments.push({ row: index, token, from: lane, to: targetLane, lane, merge: false });
      }
    }
    rows.push({ lane: commitLane, width: Math.max(before.length, uniqueNext.length) });
    lanes.splice(0, lanes.length, ...uniqueNext);
  }
  return { rows, segments, maxLane: Math.max(0, ...rows.map((row) => row.width)) };
}

function drawGraph() {
  const layout = computeLayout();
  const graphWidth = Math.max(980, GRAPH_LEFT + layout.maxLane * LANE_WIDTH + LABEL_LEFT + 1040);
  const graphHeight = Math.max(1, compressedGraph.nodes.length * ROW_HEIGHT + 20);
  graph.setAttribute('viewBox', '0 0 ' + graphWidth + ' ' + graphHeight);
  graph.setAttribute('width', graphWidth);
  graph.setAttribute('height', graphHeight);

  for (const segment of layout.segments) {
    const y = segment.row * ROW_HEIGHT + ROW_HEIGHT / 2;
    const fromX = GRAPH_LEFT + segment.from * LANE_WIDTH;
    const toX = GRAPH_LEFT + segment.to * LANE_WIDTH;
    const path = element('path', { d: pathFor(fromX, y, toX, y + ROW_HEIGHT), class: 'graph-path' + (segment.merge ? ' merge' : ''), stroke: laneColor(segment.lane), 'data-row': segment.row });
    pathLayer.appendChild(path);
    commitPaths.push({ path, row: segment.row, from: segment.from, to: segment.to });
  }

  for (let index = 0; index < compressedGraph.nodes.length; index += 1) {
    const displayNode = compressedGraph.nodes[index];
    const commit = SNAPSHOT.commits[displayNode.representative];
    const row = layout.rows[index];
    const x = GRAPH_LEFT + row.lane * LANE_WIDTH;
    const y = index * ROW_HEIGHT + ROW_HEIGHT / 2;
    const isGroup = displayNode.kind === 'group';
    const nodeClass = isGroup ? 'graph-node group' : 'graph-node' + (commit[1].length > 1 ? ' merge' : '');
    const ariaLabel = isGroup ? '連続する ' + displayNode.members.length + ' コミットを省略' : commit[0] + ' ' + commit[4];
    const node = element('g', { class: nodeClass, transform: 'translate(' + x + ' ' + y + ')', 'data-display-node': index, tabindex: '0', role: 'button', 'aria-label': ariaLabel });
    const halo = isGroup
      ? element('rect', { class: 'node-halo', x: -15, y: -8, width: 30, height: 16, rx: 5, stroke: laneColor(row.lane) })
      : element('rect', { class: 'node-halo', x: -6, y: -6, width: 12, height: 12, stroke: laneColor(row.lane) });
    node.append(halo);
    if (isGroup) {
      const groupCount = element('text', { class: 'group-count', x: 0, y: 0 });
      groupCount.textContent = '×' + displayNode.members.length;
      node.append(groupCount);
    } else {
      const core = element('circle', { class: 'node-core', cx: 0, cy: 0, r: 3.2, fill: laneColor(row.lane) });
      node.append(core);
    }
    node.addEventListener('click', () => selectDisplayNode(index, true));
    node.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectDisplayNode(index, true); }
    });
    nodeLayer.appendChild(node);
    commitNodes.set(index, node);

    const label = element('text', { x: LABEL_LEFT, y: y + 4, class: 'graph-label' });
    if (isGroup) {
      label.textContent = '×' + displayNode.members.length + ' commits を省略';
    } else {
      const sha = element('tspan', { class: 'graph-sha' });
      sha.textContent = commit[0];
      const subject = element('tspan', { dx: 12 });
      subject.textContent = shortSubject(commit[4]);
      label.append(sha, subject);
    }
    labelLayer.appendChild(label);
  }
  document.getElementById('compression-note').textContent = ' / ' + SNAPSHOT.counts.commits.toLocaleString('ja-JP') + ' → ' + compressedGraph.nodes.length.toLocaleString('ja-JP') + ' 表示点';
}

function createRefList() {
  const list = document.getElementById('ref-list');
  const allButton = document.createElement('button');
  allButton.type = 'button';
  allButton.className = 'ref-entry';
  allButton.setAttribute('aria-pressed', 'true');
  allButton.innerHTML = '<span class="ref-swatch" style="background:#89b4ff"></span><span class="ref-name">すべての参照</span><span class="ref-kind">all</span>';
  allButton.addEventListener('click', () => selectRef(null));
  list.appendChild(allButton);
  SNAPSHOT.refs.forEach((ref, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'ref-entry';
    button.dataset.ref = String(index);
    button.setAttribute('aria-pressed', 'false');
    const color = branchColor(index);
    const name = ref.symbolicTarget ? ref.name + ' → ' + ref.symbolicTarget : ref.name;
    button.innerHTML = '<span class="ref-swatch" style="background:' + color + '"></span><span class="ref-name" title="' + escapeText(name) + '">' + escapeText(name) + '</span><span class="ref-kind">' + ref.kind + '</span>';
    button.addEventListener('click', () => selectRef(index));
    list.appendChild(button);
  });
}

function ancestorSet(tip) {
  const result = new Set();
  const stack = [tip];
  while (stack.length) {
    const index = stack.pop();
    if (result.has(index) || index === undefined) continue;
    result.add(index);
    stack.push(...SNAPSHOT.commits[index][1]);
  }
  return result;
}

function selectRef(refIndex) {
  selectedRef = refIndex;
  const active = refIndex === null ? null : ancestorSet(SNAPSHOT.refs[refIndex].tip);
  const activeDisplay = active === null ? null : new Set(
    compressedGraph.nodes
      .map((node, index) => ({ node, index }))
      .filter(({ node }) => node.members.some((member) => active.has(member)))
      .map(({ index }) => index),
  );
  document.querySelectorAll('.ref-entry').forEach((button) => {
    const isAll = !button.dataset.ref;
    button.setAttribute('aria-pressed', String(refIndex === null ? isAll : button.dataset.ref === String(refIndex)));
  });
  for (const [index, node] of commitNodes) node.classList.toggle('dim', activeDisplay !== null && !activeDisplay.has(index));
  for (const item of commitPaths) {
    const pathActive = activeDisplay === null || activeDisplay.has(item.token);
    item.path.classList.toggle('dim', !pathActive);
  }
  const target = refIndex === null ? 0 : SNAPSHOT.refs[refIndex].tip;
  selectCommit(target, false);
  scrollToCommit(target);
}

function matchesSearch(index) {
  if (!searchText) return false;
  const commit = SNAPSHOT.commits[index];
  return (commit[0] + ' ' + commit[4] + ' ' + SNAPSHOT.authors[commit[3]]).toLowerCase().includes(searchText);
}

function updateSearch() {
  let count = 0;
  let groupCount = 0;
  for (const [displayIndex, displayNode] of compressedGraph.nodes.entries()) {
    const matchingMembers = displayNode.members.filter((member) => matchesSearch(member));
    const match = matchingMembers.length > 0;
    commitNodes.get(displayIndex).classList.toggle('search-match', match);
    count += matchingMembers.length;
    if (match && displayNode.kind === 'group') groupCount += 1;
  }
  document.getElementById('search-meta').textContent = searchText ? count + ' 件一致' + (groupCount ? ' / ' + groupCount + ' 区間に圧縮' : '') : '';
}

function selectDisplayNode(displayIndex, focusDetail) {
  const displayNode = compressedGraph.nodes[displayIndex];
  const index = displayNode.representative;
  selectedCommit = index;
  for (const [nodeIndex, node] of commitNodes) node.classList.toggle('selected', nodeIndex === displayIndex);
  if (displayNode.kind === 'group') {
    const newest = SNAPSHOT.commits[displayNode.members[0]];
    const oldest = SNAPSHOT.commits[displayNode.members[displayNode.members.length - 1]];
    const parentText = displayNode.parentActuals.length
      ? displayNode.parentActuals.map((parent) => SNAPSHOT.commits[parent][0]).join('  ·  ')
      : 'root commit';
    const detail = document.getElementById('commit-detail');
    detail.innerHTML = '<div class="detail-grid">' +
      '<div class="detail-subject">×' + displayNode.members.length + ' commits を省略</div>' +
      '<div class="detail-meta"><code>' + newest[0] + '</code> → <code>' + oldest[0] + '</code>  ·  ' + formatDate(oldest[2]) + ' – ' + formatDate(newest[2]) + '</div>' +
      '<div class="detail-refs">linear history</div>' +
      '<div class="detail-parents">parents: ' + escapeText(parentText) + '</div>' +
      '</div>';
    if (focusDetail) detail.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }
  const commit = SNAPSHOT.commits[index];
  const refs = refsByCommit.get(index) || [];
  const detail = document.getElementById('commit-detail');
  const parentText = commit[1].length ? commit[1].map((parent) => SNAPSHOT.commits[parent][0]).join('  ·  ') : 'root commit';
  detail.innerHTML = '<div class="detail-grid">' +
    '<div class="detail-subject">' + escapeText(commit[4]) + '</div>' +
    '<div class="detail-meta"><code>' + commit[0] + '</code>  ·  ' + escapeText(SNAPSHOT.authors[commit[3]]) + '  ·  ' + formatDate(commit[2]) + '</div>' +
    '<div class="detail-refs">' + (refs.length ? refs.map((ref) => escapeText(ref.name)).join('  ·  ') : '') + '</div>' +
    '<div class="detail-parents">parents: ' + escapeText(parentText) + '</div>' +
    '</div>';
  if (focusDetail) detail.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function selectCommit(index, focusDetail) {
  const displayIndex = displayNodeByCommit.get(index);
  if (displayIndex !== undefined) selectDisplayNode(displayIndex, focusDetail);
}

function scrollToCommit(index) {
  const displayIndex = displayNodeByCommit.get(index);
  const node = commitNodes.get(displayIndex);
  if (!node) return;
  const y = displayIndex * ROW_HEIGHT;
  graphScroll.scrollTo({ top: Math.max(0, y - graphScroll.clientHeight / 2), behavior: 'smooth' });
  node.focus({ preventScroll: true });
}

document.getElementById('current-branch').textContent = SNAPSHOT.currentBranch;
document.getElementById('commit-count').textContent = SNAPSHOT.counts.commits.toLocaleString('ja-JP');
document.getElementById('merge-count').textContent = SNAPSHOT.counts.merges.toLocaleString('ja-JP');
document.getElementById('ref-count').textContent = SNAPSHOT.counts.refs.toLocaleString('ja-JP');
document.getElementById('snapshot-date').textContent = new Date(SNAPSHOT.generatedAt).toLocaleDateString('ja-JP');
document.getElementById('ref-section-count').textContent = SNAPSHOT.counts.refs;
document.getElementById('commit-search').addEventListener('input', (event) => {
  searchText = event.target.value.trim().toLowerCase();
  updateSearch();
});
document.getElementById('fit-latest').addEventListener('click', () => scrollToCommit(0));
document.getElementById('fit-selected').addEventListener('click', () => scrollToCommit(selectedCommit === null ? 0 : selectedCommit));

drawGraph();
createRefList();
selectCommit(0, false);
</script>
</body>
</html>
