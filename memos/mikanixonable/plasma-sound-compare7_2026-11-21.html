<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>敵弾(プラズマ)至近通過音 聴き比べ 7 (低域シフト)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:2em auto;padding:0 1em;background:#111;color:#ddd}
  h1{font-size:1.3em}
  .card{border:1px solid #333;border-radius:8px;padding:1em;margin:1em 0;background:#181818}
  .card h2{margin:0 0 .3em;font-size:1.05em}
  .card p{margin:.3em 0 .8em;color:#aaa;font-size:.85em;line-height:1.5}
  button{background:#2a5;color:#fff;border:0;border-radius:6px;padding:.55em 1.2em;margin-right:.6em;font-size:.95em;cursor:pointer}
  button.burst{background:#36c}
  button:active{filter:brightness(1.3)}
  label{font-size:.85em;color:#bbb;display:block;margin:1.5em 0 .3em}
  input[type=range]{width:320px;vertical-align:middle}
  #volVal{margin-left:.6em}
</style>
</head>
<body>
<h1>敵弾(プラズマ)至近通過音 聴き比べ 7 — 低域シフトで重厚に</h1>
<p style="color:#999;font-size:.85em">第6回では層の追加が全て低評価で、「重厚さ=主音を低くする」が唯一伸びました。
G5(半音下げ)を基準に、下げ幅・追い波の連動・サブの深さを変えて最終形を絞ります。</p>

<label>マスター音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><span id="volVal">0.80</span></label>

<div id="cards"></div>

<h2 style="font-size:1em">採点(1=不採用〜4=採用候補)</h2>
<button id="export" style="background:#555">採点をコピー</button>
<button id="resetScores" style="background:#733">採点リセット</button>
<pre id="scoreOut" style="background:#0a0a0a;border:1px solid #333;padding:.8em;margin-top:1em;font-size:.8em;display:none;white-space:pre-wrap"></pre>

<script>
const ctx = new AudioContext();
const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
document.getElementById('vol').oninput = e => {
  master.gain.value = +e.target.value;
  document.getElementById('volVal').textContent = (+e.target.value).toFixed(2);
};
const jit = (v, pct) => v * (1 + (Math.random() * 2 - 1) * pct);
const panOf = () => (Math.random() < 0.5 ? -1 : 1) * jit(0.45, 0.6);

function drone(t, {
  type = 'sawtooth', fLow = 60, fPeak = 80, dur = 0.4, rise = 0.35,
  lpLow = 100, lpHigh = 400, lpQ = 1, vol = 0.15, pan = 0, detune = 0,
} = {}) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(jit(fLow, 0.04) + detune, t);
  o.frequency.exponentialRampToValueAtTime(jit(fPeak, 0.04) + detune, t + dur * rise);
  o.frequency.exponentialRampToValueAtTime(jit(fLow * 0.7, 0.04) + detune, t + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = lpQ;
  f.frequency.setValueAtTime(lpLow, t);
  f.frequency.exponentialRampToValueAtTime(lpHigh, t + dur * 0.3);
  f.frequency.exponentialRampToValueAtTime(lpLow, t + dur * 0.8);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(f).connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function partial(t, freq, dur, vol) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

// ---- 基盤: 本体(shift で全体を移調) + 5度和音 + 和音付き追い波 + サブ ----
function base(t, {
  fLow = 52, fPeak = 70, vol = 0.16, dur = 0.4,
  ratio = 1.52, chordType = 'triangle', chordVol = 0.09, chordLp = 600,
  wakeShift = 1,          // 追い波の移調比(1=従来の55-70、<1 で本体に合わせて下げる)
  wakeDelay = 0.12, wakeVol = 0.1, wakeDur = 0.34,
  sub = 0.12, subFreq = 32, pan = null,
} = {}) {
  if (pan === null) pan = panOf();
  drone(t, { fLow, fPeak, vol, dur, pan });
  drone(t, {
    type: chordType, fLow: fLow * ratio, fPeak: fPeak * ratio,
    lpHigh: chordLp, vol: chordVol, dur, pan, detune: 3,
  });
  const t2 = t + wakeDelay + Math.random() * 0.04;
  drone(t2, { fLow: 55 * wakeShift, fPeak: 70 * wakeShift, vol: wakeVol, dur: wakeDur, pan: -pan });
  drone(t2, {
    type: chordType, fLow: 55 * wakeShift * ratio, fPeak: 70 * wakeShift * ratio,
    lpHigh: chordLp, vol: wakeVol * 0.6, dur: wakeDur, pan: -pan, detune: 3,
  });
  if (sub) partial(t, jit(subFreq, 0.1), 0.45, sub);
}

// ============ 案 ============

// H1: G5 そのまま(対照)
function h1(t) { base(t); }
// H2: 全音下げ(47→63Hz)
function h2(t) { base(t, { fLow: 47, fPeak: 63 }); }
// H3: 短3度下げ(44→59Hz) — 下げ幅の上限確認
function h3(t) { base(t, { fLow: 44, fPeak: 59, vol: 0.18 }); }
// H4: 半音下げ + 追い波も同じだけ下げる(全体が一体で低い)
function h4(t) { base(t, { wakeShift: 0.87 }); }
// H5: 全音下げ + 追い波も連動 + サブ 28Hz(最も深い構成)
function h5(t) { base(t, { fLow: 47, fPeak: 63, wakeShift: 0.78, subFreq: 28, sub: 0.14 }); }
// H6: 半音下げ + 和音を大きく(chordVol 0.12、低い和音で重厚に)
function h6(t) { base(t, { chordVol: 0.12 }); }
// H7: 半音下げ + 本体だけ下げ和音は据え置き(低い本体+明るい和音の分離)
function h7(t) {
  const pan = panOf();
  drone(t, { fLow: 52, fPeak: 70, vol: 0.16, pan });
  drone(t, { type: 'triangle', fLow: 60 * 1.52, fPeak: 80 * 1.52, lpHigh: 600, vol: 0.09, pan, detune: 3 });
  const t2 = t + 0.12 + Math.random() * 0.04;
  drone(t2, { fLow: 55, fPeak: 70, vol: 0.1, dur: 0.34, pan: -pan });
  partial(t, jit(32, 0.1), 0.45, 0.12);
}
// H8: 半音下げ + 発音ごとに ±3% の移調ゆらぎ(多様性は G8 要素を移調へ)
function h8(t) {
  const shift = Math.exp((Math.random() * 2 - 1) * 0.03);
  base(t, { fLow: 52 * shift, fPeak: 70 * shift, wakeShift: 0.87 * shift });
}

const variants = [
  { id: 'H1', name: 'G5 そのまま(対照)', fn: h1, desc: '半音下げ基準。' },
  { id: 'H2', name: '全音下げ', fn: h2, desc: '47→63Hz。' },
  { id: 'H3', name: '短3度下げ', fn: h3, desc: '44→59Hz。下げ幅の上限。' },
  { id: 'H4', name: '追い波も連動して下げ', fn: h4, desc: '全体が一体で低い。' },
  { id: 'H5', name: '全音下げ+追い波連動+深サブ', fn: h5, desc: '最も深い構成。28Hz サブ。' },
  { id: 'H6', name: '半音下げ+強い和音', fn: h6, desc: '低い和音を大きく。' },
  { id: 'H7', name: '本体だけ下げる', fn: h7, desc: '低い本体+据え置きの明るい和音。' },
  { id: 'H8', name: '移調ゆらぎ', fn: h8, desc: '発音ごとに±3%の高さ変化。' },
];

const cards = document.getElementById('cards');
const timers = new Map();
for (const v of variants) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${v.id}. ${v.name}</h2><p>${v.desc}</p>`;
  const b1 = document.createElement('button'); b1.textContent = '1回';
  b1.onclick = () => { ctx.resume(); v.fn(ctx.currentTime + 0.05); };
  const b2 = document.createElement('button'); b2.textContent = '連続(押し続け)';
  b2.className = 'burst';
  const start = () => {
    ctx.resume();
    v.fn(ctx.currentTime + 0.05);
    timers.set(v.id, setInterval(() => { v.fn(ctx.currentTime + 0.01); }, 550));
  };
  const stop = () => { clearInterval(timers.get(v.id)); timers.delete(v.id); };
  b2.onpointerdown = start; b2.onpointerup = b2.onpointerleave = stop;
  card.append(b1, b2);
  const row = document.createElement('div');
  row.style.marginTop = '.6em';
  row.append('採点: ');
  const btns = [];
  const paint = () => {
    const r = JSON.parse(localStorage.getItem('plasma-ratings7') || '{}');
    btns.forEach((b, i) => { b.style.background = r[v.id] === i + 1 ? '#c93' : '#333'; });
  };
  for (let n = 1; n <= 4; n++) {
    const b = document.createElement('button');
    b.textContent = n; b.style.padding = '.3em .8em'; b.style.marginRight = '.4em';
    b.onclick = () => {
      const r = JSON.parse(localStorage.getItem('plasma-ratings7') || '{}');
      if (r[v.id] === n) delete r[v.id]; else r[v.id] = n;
      localStorage.setItem('plasma-ratings7', JSON.stringify(r));
      paint();
    };
    btns.push(b); row.append(b);
  }
  paint();
  card.append(row);
  cards.append(card);
}
document.getElementById('export').onclick = async () => {
  const ratings = JSON.parse(localStorage.getItem('plasma-ratings7') || '{}');
  const lines = variants
    .map(v => `${v.id} ${v.name}: ${ratings[v.id] ?? '未採点'}`)
    .sort((a, b) => (parseInt(b.match(/: (\d)/)?.[1] || '0')) - (parseInt(a.match(/: (\d)/)?.[1] || '0')));
  const text = '敵弾7(低域シフト) 採点(4段階)\n' + lines.join('\n');
  const out = document.getElementById('scoreOut');
  out.textContent = text; out.style.display = 'block';
  try { await navigator.clipboard.writeText(text); out.textContent += '\n\n(クリップボードへコピー済み)'; } catch {}
};
document.getElementById('resetScores').onclick = () => {
  localStorage.removeItem('plasma-ratings7');
  location.reload();
};
</script>
</body>
</html>
