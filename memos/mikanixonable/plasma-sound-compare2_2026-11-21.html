<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>敵弾(プラズマ)至近通過音 聴き比べ 2 (ヴン強化)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:2em auto;padding:0 1em;background:#111;color:#ddd}
  h1{font-size:1.3em}
  .card{border:1px solid #333;border-radius:8px;padding:1em;margin:1em 0;background:#181818}
  .card h2{margin:0 0 .3em;font-size:1.05em}
  .card p{margin:.3em 0 .8em;color:#aaa;font-size:.85em;line-height:1.5}
  button{background:#2a5;color:#fff;border:0;border-radius:6px;padding:.55em 1.2em;margin-right:.6em;font-size:.95em;cursor:pointer}
  button.burst{background:#36c}
  button:active{filter:brightness(1.3)}
  .cur{border-color:#666}
  .cur h2::after{content:"（現行）";color:#888;font-size:.8em}
  label{font-size:.85em;color:#bbb;display:block;margin:1.5em 0 .3em}
  input[type=range]{width:320px;vertical-align:middle}
  #volVal{margin-left:.6em}
</style>
</head>
<body>
<h1>敵弾(プラズマ)至近通過音 聴き比べ 2 — 「ヴン」の層・多様性・音色</h1>
<p style="color:#999;font-size:.85em">現行の低い唸りが勝ったので、方向は変えずに「重奏性・多様性・リッチさ・音色」を強化した案。
各案は現行の骨格（40〜80Hz の saw を LP スイープで膨らませる）を維持し、足し方だけを変えています。</p>

<label>マスター音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><span id="volVal">0.80</span></label>

<div id="cards"></div>

<h2 style="font-size:1em">採点(1=不採用〜4=採用候補)</h2>
<button id="export" style="background:#555">採点をコピー</button>
<button id="resetScores" style="background:#733">採点リセット</button>
<pre id="scoreOut" style="background:#0a0a0a;border:1px solid #333;padding:.8em;margin-top:1em;font-size:.8em;display:none;white-space:pre-wrap"></pre>

<script>
const ctx = new AudioContext();
const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
document.getElementById('vol').oninput = e => {
  master.gain.value = +e.target.value;
  document.getElementById('volVal').textContent = (+e.target.value).toFixed(2);
};
const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
{ const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
const jit = (v, pct) => v * (1 + (Math.random() * 2 - 1) * pct);
const panOf = () => (Math.random() < 0.5 ? -1 : 1) * jit(0.45, 0.6);

// ---- 現行の骨格(パラメータ化) ----
// 低い saw が fLow→fPeak→fLow へ滑り、LP が dark→bright→dark へ開閉し、音量が膨らんで消える。
function drone(t, {
  type = 'sawtooth', fLow = 60, fPeak = 80, dur = 0.4, rise = 0.35,
  lpLow = 100, lpHigh = 400, lpQ = 1, vol = 0.15, pan = 0, detune = 0,
} = {}) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(jit(fLow, 0.04) + detune, t);
  o.frequency.exponentialRampToValueAtTime(jit(fPeak, 0.04) + detune, t + dur * rise);
  o.frequency.exponentialRampToValueAtTime(jit(fLow * 0.7, 0.04) + detune, t + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = lpQ;
  f.frequency.setValueAtTime(lpLow, t);
  f.frequency.exponentialRampToValueAtTime(lpHigh, t + dur * 0.3);
  f.frequency.exponentialRampToValueAtTime(lpLow, t + dur * 0.8);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = f;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; f.connect(p); tail = p; }
  o.connect(f).connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function swellNoise(t, dur, type, f0, f1, q, peak, pan = 0) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  s.connect(f).connect(g).connect(p).connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function partial(t, freq, dur, vol, pan = 0) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  let tail = g;
  if (pan !== 0) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); tail = p; }
  o.connect(g); tail.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

// ============ 案 ============

// Q0: 現行
function q0(t) {
  drone(t, {});
}

// Q2: サブを追加 — 30Hz の振動が下に支える(重奏性・低域)
function q2(t) {
  const pan = panOf();
  drone(t, { pan });
  partial(t, jit(32, 0.1), 0.45, 0.12);          // サブの膨らみ
  partial(t, jit(48, 0.1), 0.4, 0.06);
}
// Q3: 共鳴の動き — LP の Q を上げて母音っぽい「ヴォン」(音色)
function q3(t) {
  const pan = panOf();
  drone(t, { lpQ: 3.5, lpLow: 80, lpHigh: 500, pan });
}
// Q4: AM で「ブルル」— 音量を 10〜16Hz で揺らす脈動(多様性)
function q4(t) {
  const pan = panOf();
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(jit(60, 0.04), t);
  o.frequency.exponentialRampToValueAtTime(jit(80, 0.04), t + 0.16);
  o.frequency.exponentialRampToValueAtTime(jit(42, 0.04), t + 0.45);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(100, t);
  f.frequency.exponentialRampToValueAtTime(420, t + 0.13);
  f.frequency.exponentialRampToValueAtTime(100, t + 0.36);
  const am = ctx.createGain(); am.gain.value = 0;
  const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = jit(12, 0.3);
  const lfoG = ctx.createGain(); lfoG.gain.value = 0.05;
  const dc = ctx.createConstantSource(); dc.offset.value = 0.055;
  lfo.connect(lfoG).connect(am.gain); dc.connect(am.gain);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(0.8, t + 0.22);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  o.connect(f).connect(am).connect(g).connect(p).connect(master);
  [o, lfo, dc].forEach(x => { x.start(t); x.stop(t + 0.5); });
}

// Q6: オクターブ和音 — saw + square を 1オクターブ違いで重ねる厚み(重奏性)
function q6(t) {
  const pan = panOf();
  drone(t, { pan });
  drone(t, { type: 'square', fLow: 120, fPeak: 160, lpHigh: 600, vol: 0.06, pan, detune: 3 });
}
// Q7: 二段ヴン — 本体のあと 80ms に小さい追い波(通過の残り・多様性)
function q7(t) {
  const pan = panOf();
  drone(t, { pan });
  drone(t + 0.08 + Math.random() * 0.04, { fLow: 55, fPeak: 70, vol: 0.08, dur: 0.3, pan: -pan });
}
// Q8: FM で低域に金属のざらつき(音色)
function q8(t) {
  const pan = panOf();
  const c = ctx.createOscillator(); c.type = 'sawtooth';
  c.frequency.setValueAtTime(jit(62, 0.04), t);
  c.frequency.exponentialRampToValueAtTime(jit(82, 0.04), t + 0.16);
  c.frequency.exponentialRampToValueAtTime(jit(44, 0.04), t + 0.42);
  const m = ctx.createOscillator(); m.frequency.setValueAtTime(jit(62 * 2.3, 0.05), t);
  const mi = ctx.createGain();
  mi.gain.setValueAtTime(90, t);
  mi.gain.exponentialRampToValueAtTime(5, t + 0.35);
  m.connect(mi).connect(c.frequency);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(120, t);
  f.frequency.exponentialRampToValueAtTime(450, t + 0.13);
  f.frequency.exponentialRampToValueAtTime(120, t + 0.36);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.01, t);
  g.gain.linearRampToValueAtTime(0.15, t + 0.22);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  c.connect(f).connect(g).connect(p).connect(master);
  [c, m].forEach(x => { x.start(t); x.stop(t + 0.48); });
}
// Q9: 長い尾 — 本体のあと低い尾が残る(リッチさ)
function q9(t) {
  const pan = panOf();
  drone(t, { pan });
  swellNoise(t + 0.05, 0.7, 'lowpass', 150, 70, 1.5, 0.08, pan);
  partial(t + 0.05, jit(45, 0.08), 0.6, 0.05);
}


const variants = [
  { id: 'Q0', name: '現行「ヴン」', cls: 'cur', fn: q0, desc: '基準。' },
  { id: 'Q2', name: 'サブ追加', fn: q2, desc: '32Hz の振動が下に支える。重さの追加。' },
  { id: 'Q3', name: '共鳴強め', fn: q3, desc: 'LP の Q を 3.5 へ。母音っぽい「ヴォン」。' },
  { id: 'Q4', name: 'AM ブルル', fn: q4, desc: '音量を 12Hz で揺らす脈動。機械的な危なさ。' },
  { id: 'Q6', name: 'オクターブ和音', fn: q6, desc: 'saw + 1オクターブ上の square。分厚い和音。' },
  { id: 'Q7', name: '二段ヴン', fn: q7, desc: '80ms 遅れの追い波。通過の「引き波」が出る。' },
  { id: 'Q8', name: 'FM ざらつき', fn: q8, desc: '低域に FM の金属ざらつき。電子的だが低いまま。' },
  { id: 'Q9', name: '長い尾', fn: q9, desc: '本体のあと 0.7s の低い残り。' },
];

const cards = document.getElementById('cards');
const timers = new Map();
for (const v of variants) {
  const card = document.createElement('div');
  card.className = 'card ' + (v.cls || '');
  card.innerHTML = `<h2>${v.id}. ${v.name}</h2><p>${v.desc}</p>`;
  const b1 = document.createElement('button'); b1.textContent = '1回';
  b1.onclick = () => { ctx.resume(); v.fn(ctx.currentTime + 0.05); };
  const b2 = document.createElement('button'); b2.textContent = '連続(押し続け)';
  b2.className = 'burst';
  const start = () => {
    ctx.resume();
    v.fn(ctx.currentTime + 0.05);
    timers.set(v.id, setInterval(() => { v.fn(ctx.currentTime + 0.01); }, 550));
  };
  const stop = () => { clearInterval(timers.get(v.id)); timers.delete(v.id); };
  b2.onpointerdown = start; b2.onpointerup = b2.onpointerleave = stop;
  card.append(b1, b2);
  const row = document.createElement('div');
  row.style.marginTop = '.6em';
  row.append('採点: ');
  const btns = [];
  const paint = () => {
    const r = JSON.parse(localStorage.getItem('plasma-ratings2') || '{}');
    btns.forEach((b, i) => { b.style.background = r[v.id] === i + 1 ? '#c93' : '#333'; });
  };
  for (let n = 1; n <= 4; n++) {
    const b = document.createElement('button');
    b.textContent = n; b.style.padding = '.3em .8em'; b.style.marginRight = '.4em';
    b.onclick = () => {
      const r = JSON.parse(localStorage.getItem('plasma-ratings2') || '{}');
      if (r[v.id] === n) delete r[v.id]; else r[v.id] = n;
      localStorage.setItem('plasma-ratings2', JSON.stringify(r));
      paint();
    };
    btns.push(b); row.append(b);
  }
  paint();
  card.append(row);
  cards.append(card);
}
document.getElementById('export').onclick = async () => {
  const ratings = JSON.parse(localStorage.getItem('plasma-ratings2') || '{}');
  const lines = variants
    .map(v => `${v.id} ${v.name}: ${ratings[v.id] ?? '未採点'}`)
    .sort((a, b) => (parseInt(b.match(/: (\d)/)?.[1] || '0')) - (parseInt(a.match(/: (\d)/)?.[1] || '0')));
  const text = '敵弾2(ヴン強化) 採点(4段階)\n' + lines.join('\n');
  const out = document.getElementById('scoreOut');
  out.textContent = text; out.style.display = 'block';
  try { await navigator.clipboard.writeText(text); out.textContent += '\n\n(クリップボードへコピー済み)'; } catch {}
};
document.getElementById('resetScores').onclick = () => {
  localStorage.removeItem('plasma-ratings2');
  location.reload();
};
</script>
</body>
</html>
